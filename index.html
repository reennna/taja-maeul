<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 타자 마을</title>
<script>
/* ============================================================
   반 랭킹 자동 연동 주소
   구글 Apps Script 웹 앱 주소(https://script.google.com/macros/s/…/exec)를
   아래 따옴표 안에 붙여 넣으면 자동 연동이 켜져요. 비워 두면 꺼져요.
   ============================================================ */
window.TAJA_SYNC_URL = 'https://script.google.com/macros/s/AKfycbw6gZXufTAuKirWz9M2cmYoUgGc7UKmGDJVymQb9nPFBIuTUBK718gx6SfSFFVN_T7T/exec';
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a1f2b;--steel:#2f2f35}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#16202c;overflow:hidden;font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;word-break:keep-all}
input,textarea{user-select:text;-webkit-user-select:text;font-family:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#7cc6ee}
#cv{position:absolute;left:0;top:0;width:1280px;height:720px}
.screen{position:absolute;inset:0}
.hidden{display:none!important}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc928 55%,#e09a00);border:.09em solid #9a6400;box-shadow:inset 0 0 0 .13em rgba(255,255,255,.35);vertical-align:-.14em}

/* ---------- 홈 ---------- */
#home{pointer-events:none}
#home>*{pointer-events:auto}
.logo{position:absolute;left:0;right:0;top:18px;text-align:center;pointer-events:none!important;line-height:1}
.logo-sub,.logo-main{display:inline-block;paint-order:stroke fill;-webkit-text-stroke:12px var(--ink);filter:drop-shadow(0 4px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 10px 8px rgba(0,0,0,.25))}
.logo-sub{font-size:44px;color:#ffae1f;transform:rotate(-3deg)}
.logo-main{display:block;font-size:106px;color:#ff5fa8;-webkit-text-stroke:16px var(--ink);margin-top:2px;letter-spacing:4px}
.pcard{position:absolute;left:18px;top:16px;width:250px;background:rgba(255,255,255,.94);border:4px solid var(--ink);border-radius:22px;padding:10px 16px;box-shadow:0 5px 0 var(--ink)}
.pname{font-size:30px;color:#2a2a30;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:19px;color:#7b4b58}
.pcoin{margin-top:4px;font-size:30px;color:#2a2a30}
.topbtns{position:absolute;right:20px;top:16px;display:flex;gap:10px}
.ibtn{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc928 60%,#e59a00);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;position:relative}
.ibtn svg{width:30px;height:30px;fill:var(--ink)}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ibtn .tip{position:absolute;top:66px;white-space:nowrap;background:rgba(40,20,30,.88);color:#fff;font-size:18px;padding:3px 10px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .15s}
.ibtn:hover .tip{opacity:1}
.bigbtn{position:absolute;left:450px;top:186px;width:380px;height:100px;border-radius:999px;background:linear-gradient(#ff8cc0,#ff4f9a);border:5px solid var(--ink);box-shadow:0 8px 0 var(--ink);font-size:52px;color:#fff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill}
.bigbtn:active{transform:translateY(5px);box-shadow:0 3px 0 var(--ink)}
.menurow{position:absolute;left:0;right:0;top:318px;display:flex;justify-content:center;gap:18px}
.mbtn{width:190px;height:96px;border-radius:24px;background:linear-gradient(#ffffff,#e8f4ff);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-size:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.mbtn .mi{font-size:34px}
.mbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
#ttoast{position:absolute;left:50%;top:668px;transform:translateX(-50%);background:rgba(40,20,30,.93);color:#fff;font-size:26px;padding:10px 26px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:50}
#ttoast.show{opacity:1}

/* ---------- 마을 꾸미기 ---------- */
#decoUI{pointer-events:none}
#decoUI>*{pointer-events:auto}
.dbar{position:absolute;left:18px;right:18px;top:14px;height:66px;background:rgba(255,255,255,.95);border:4px solid var(--ink);border-radius:22px;display:flex;align-items:center;gap:14px;padding:0 16px}
.dbar b{font-size:32px;font-weight:normal;white-space:nowrap}
.dbar span{font-size:20px;color:#6a3b48;flex:1}
.dbar .gbtn,.dbar .sbtn{display:inline-block;width:auto;flex:0 0 auto;margin:0}
.dstore{position:absolute;left:18px;right:18px;top:92px;height:150px;background:rgba(255,255,255,.9);border:4px solid var(--ink);border-radius:22px;display:flex;gap:10px;padding:10px;overflow-x:auto;align-items:center}
.dcard{flex:0 0 auto;width:112px;height:124px;border:3px solid var(--steel);border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;line-height:1.1}
.dcard.on{background:#fff3b8;border-color:#d6336c;box-shadow:0 0 0 3px #d6336c}
.dcard canvas{width:84px;height:84px}
.dcard span{font-size:17px;white-space:nowrap}
.dcard i{position:absolute;right:6px;top:4px;font-style:normal;font-size:18px;background:var(--ink);color:#fff;border-radius:999px;padding:0 7px}
.dempty{font-size:24px;color:#7b4b58;padding:0 20px}

/* ---------- HUD ---------- */
#hud{pointer-events:none}
#hud .inbar,#hud .pbtn,#hud .slots{pointer-events:auto}
.hearts{position:absolute;left:84px;top:30px;height:46px;padding:0 36px 0 30px;background:linear-gradient(90deg,rgba(18,18,24,.88) 75%,rgba(18,18,24,0));display:flex;gap:3px;align-items:center;border-radius:0 24px 24px 0}
.hearts i{display:block;width:27px;height:25px}
.hearts svg{width:100%;height:100%;fill:#ff3d55;stroke:#7a0f1c;stroke-width:1.5}
.hearts i.off svg{fill:#4b4b55;stroke:#2a2a30}
.rbadge{position:absolute;left:18px;top:12px;width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c2,#ffcd3c 55%,#e08e00);border:4px solid var(--steel);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:#2a2a30;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.rbadge small{font-size:15px}.rbadge b{font-size:40px;font-weight:normal}
.rprog{position:absolute;left:490px;top:16px;width:300px;background:rgba(18,18,24,.86);border:3px solid #fff;border-radius:20px;padding:6px 14px 10px;color:#fff;text-align:center;font-size:24px}
.rprog .bar{height:12px;border-radius:999px;background:#454552;margin-top:4px;overflow:hidden}
.rprog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ad7ff,#ffe066);border-radius:999px;transition:width .2s}
.hcoin{position:absolute;right:18px;top:22px;min-width:200px;height:60px;background:linear-gradient(90deg,rgba(15,15,18,0),#111 25%);color:#fff;font-size:42px;text-align:right;padding-right:20px;line-height:60px;border-radius:12px}
.hcoin .coin{margin-right:10px}
.hcoin.dbl{color:#ffe14d}
.combo{position:absolute;right:28px;top:90px;font-size:32px;color:#ffe14d;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill}
.effects{position:absolute;left:112px;top:84px;display:flex;gap:6px}
.eff{background:rgba(18,18,24,.86);color:#fff;border-radius:999px;padding:3px 14px;font-size:22px}
.inbar{position:absolute;left:320px;top:638px;width:640px;height:66px}
#inp{width:100%;height:100%;border-radius:22px;border:4px solid var(--steel);background:linear-gradient(#ffffff,#e6eaf0);font-size:34px;text-align:center;color:#222;outline:none;box-shadow:0 5px 0 var(--steel)}
#inp::placeholder{color:#a3a9b3;font-size:24px}
#inp.bad{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.pbtn{position:absolute;left:986px;top:640px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c3c9d0 55%,#7d858e);border:4px solid var(--steel);box-shadow:0 4px 0 var(--steel);display:flex;align-items:center;justify-content:center}
.pbtn svg{width:26px;height:26px;fill:#26262c}
.toast{position:absolute;left:50%;top:568px;transform:translateX(-50%);background:rgba(30,20,40,.93);color:#fff;font-size:26px;padding:10px 26px;border-radius:999px;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:210px;color:#fff;-webkit-text-stroke:20px var(--ink);paint-order:stroke fill;pointer-events:none;opacity:0}
#count.pop{animation:pop .9s ease-out forwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.15);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.slots{position:absolute;left:24px;top:632px;display:flex;gap:8px}
.slot{width:86px;height:74px;border-radius:16px;border:4px solid var(--steel);background:rgba(255,255,255,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--steel);line-height:1.05}
.slot .ic{font-size:30px}
.slot .nm{font-size:19px;color:#2a2a30;white-space:nowrap}
.slot.empty{background:rgba(255,255,255,.35);border-style:dashed;box-shadow:none}
.slot.empty .nm{color:rgba(40,40,48,.65);font-size:17px}
.slot.new{animation:slotpop .6s}
.slot.hot{outline:4px solid #d6336c;outline-offset:2px}
@keyframes slotpop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
#hud .slots.s4{left:12px;gap:4px}
#hud .slots.s4 .slot{width:72px}

/* ---------- 패널 ---------- */
.overlay{position:absolute;inset:0;background:rgba(10,15,30,.5);display:flex;align-items:center;justify-content:center;z-index:10}
.panel{background:linear-gradient(#ffffff,#dde2e9);border:5px solid var(--steel);border-radius:32px;box-shadow:0 10px 0 var(--steel),0 24px 50px rgba(0,0,0,.4);padding:24px 36px 22px;text-align:center;width:500px;max-height:690px;overflow:auto}
.panel.wide{width:860px}
.panel.xl{width:1160px}
.panel h2{font-size:46px;font-weight:normal;margin-bottom:6px;color:#2a2a30}
.panel h3{font-size:26px;font-weight:normal;margin:10px 0 4px;color:#2a2a30;text-align:left}
.panel .sub{font-size:21px;color:#5d5f68;margin-bottom:10px}
.gbtn,.sbtn{display:block;width:100%;margin:10px 0;padding:8px 24px;font-size:32px;border:4px solid var(--ink);border-radius:999px;box-shadow:0 5px 0 var(--ink)}
.gbtn{background:linear-gradient(#ffe36b,#f7b500)}
.sbtn{background:linear-gradient(#ffffff,#e9e9ee);font-size:27px}
.gbtn small{display:block;font-size:18px;opacity:.75;margin-top:-2px}
.gbtn:active,.sbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.inline{display:inline-block;width:auto;margin:0 6px;min-width:170px}
.sm{font-size:22px;padding:4px 16px;min-width:0;margin:0;box-shadow:0 3px 0 var(--ink)}
.btnrow{margin-top:14px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.linkbtn{font-size:20px;color:#6b6d75;text-decoration:underline;margin-top:6px}
.form{display:flex;gap:14px;justify-content:center;margin:10px 0}
.form label{display:flex;flex-direction:column;align-items:flex-start;font-size:20px;color:#5d5f68;gap:4px}
.form input{height:58px;border:4px solid var(--steel);border-radius:16px;font-size:30px;text-align:center;outline:none;width:260px}
.form input[type=number]{width:110px}
.msg{font-size:21px;color:#d0263a;min-height:26px}
.ok{color:#2b8a3e}
.tabs{display:flex;justify-content:center;gap:8px;margin:6px 0 10px;flex-wrap:wrap}
.chip{border:3px solid var(--ink);border-radius:999px;background:#fff;padding:4px 16px;font-size:23px;white-space:nowrap}
.chip.on{background:linear-gradient(#ffe36b,#f7b500);box-shadow:0 3px 0 var(--ink)}
.chip.sm2{font-size:20px;padding:3px 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 10px}
.tile{background:#fff;border:3px solid var(--steel);border-radius:18px;padding:6px 4px}
.tile small{display:block;font-size:19px;color:#6b6d75}
.tile b{font-size:34px;font-weight:normal;color:#2a2a30}
.badges{display:flex;justify-content:center;gap:8px;margin:4px 0 8px;flex-wrap:wrap}
.badge{background:#ff5fa8;color:#fff;border-radius:999px;padding:4px 16px;font-size:22px;border:3px solid var(--ink)}
.coinlist{background:#fff;border:3px solid var(--steel);border-radius:18px;padding:8px 18px;text-align:left;font-size:21px;color:#3a3a40;display:grid;grid-template-columns:1fr 1fr;column-gap:36px}
.coinlist div{display:flex;justify-content:space-between;padding:2px 0}
.coinlist .tot{grid-column:1/-1;border-top:2px dashed #c9ccd3;margin-top:4px;padding-top:6px;font-size:32px;color:#2a2a30}
.stats.six{grid-template-columns:repeat(6,1fr);gap:8px}
.stats.six .tile b{font-size:27px}
.stats.six .tile small{font-size:17px}
.rankbox{max-height:300px;overflow:auto;margin:8px 0;border-radius:16px;background:#fff;border:3px solid var(--steel)}
table.rank{width:100%;border-collapse:collapse;font-size:23px}
table.rank th{position:sticky;top:0;background:#2a2a30;color:#fff;font-weight:normal;padding:6px}
table.rank td{padding:5px 6px;border-top:1px solid #e3e5ea}
table.rank tr.me td{background:#fff3b8}
.medal{display:inline-block;width:32px;height:32px;line-height:32px;border-radius:50%;color:#fff;font-size:20px}
.m1{background:#f2b705}.m2{background:#9aa3ad}.m3{background:#c77b3a}
.empty{padding:26px;font-size:23px;color:#777}
.note{font-size:19px;color:#6b6d75;margin-top:6px}
textarea.code{width:100%;height:76px;border:3px solid var(--steel);border-radius:14px;padding:8px 12px;font-size:16px;font-family:monospace;resize:none;outline:none;word-break:break-all}
.coderow{display:flex;gap:8px;align-items:stretch;margin:6px 0}
.coderow textarea{flex:1}
.coderow .gbtn,.coderow .sbtn{width:auto;margin:0;min-width:120px;font-size:24px}
/* 상점 */
.shophead{display:flex;align-items:center;justify-content:space-between}
.wallet{font-size:36px;background:#2a2a30;color:#fff;border-radius:999px;padding:4px 22px}
.wallet .coin{margin-right:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-height:540px;overflow:auto;padding:4px 4px 8px}
.scard{background:#fff;border:3px solid var(--steel);border-radius:18px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:3px}
.scard .ic{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:36px}
.scard canvas{width:72px;height:72px;border-radius:14px;background:#e8f6ff}
.scard b{font-size:22px;font-weight:normal;color:#2a2a30}
.scard .d{font-size:16px;color:#666;min-height:40px;line-height:1.25}
.scard .own{font-size:17px;color:#7b4b58}
.buy{margin-top:4px;background:linear-gradient(#ffe36b,#f7b500);border:3px solid var(--ink);border-radius:999px;padding:3px 18px;font-size:23px;box-shadow:0 3px 0 var(--ink)}
.buy:disabled{filter:grayscale(1);opacity:.55;cursor:default}
.buy.max{background:#e9ecef}
/* 게임 선택 */
.gcards{display:flex;gap:16px;justify-content:center;margin:10px 0}
.gcard{width:330px;border:4px solid var(--ink);border-radius:24px;background:#fff;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 0 var(--ink)}
.gcard canvas{width:300px;height:150px;border-radius:16px;border:3px solid var(--ink)}
.gcard b{font-size:30px;font-weight:normal}
.gcard span{font-size:18px;color:#6a3b48;min-height:44px}
.gcard.lock{opacity:.55;box-shadow:none;cursor:default}
.gcard .lockbox{width:300px;height:150px;border-radius:16px;border:3px dashed #999;display:flex;align-items:center;justify-content:center;font-size:56px;background:#f1f3f5}
/* 가방 */
.bagrow{display:flex;gap:10px;justify-content:center;margin:8px 0 14px}
.bagrow .slot{width:100px;height:86px}
.invgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ichip{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--steel);border-radius:16px;padding:6px 12px;text-align:left}
.ichip .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px}
.ichip b{font-size:25px;font-weight:normal;flex:1}
.ichip .cnt{font-size:24px;color:#7b4b58}
.ichip.zero{opacity:.45}
.statline{font-size:20px;color:#5d5f68;margin-top:12px}
.recgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <!-- 홈 -->
  <div id="home" class="screen hidden">
    <div class="pcard"><div class="pname" id="pName"></div><div class="pmeta" id="pMeta"></div><div class="pcoin"><span class="coin"></span> <b id="pCoins" style="font-weight:normal">0</b></div></div>
    <div class="logo"><span class="logo-sub">우리 반</span><span class="logo-main">타자 마을</span></div>
    <div class="topbtns">
      <button class="ibtn" data-act="sound" aria-label="소리"><svg viewBox="0 0 24 24" class="sndIcon"></svg><span class="tip">소리</span></button>
      <button class="ibtn" data-act="full" aria-label="전체 화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="#4a1f2b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="tip">전체 화면</span></button>
      <button class="ibtn" data-act="t-open" aria-label="선생님"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10" fill="none" stroke="#4a1f2b" stroke-width="2.4"/></svg><span class="tip">선생님</span></button>
    </div>
    <button class="bigbtn" data-act="play">게임 시작</button>
    <div class="menurow">
      <button class="mbtn" data-act="shop-open"><span class="mi">🛒</span>상점</button>
      <button class="mbtn" data-act="deco-open"><span class="mi">🏡</span>마을 꾸미기</button>
      <button class="mbtn" data-act="rank-open"><span class="mi">🏆</span>랭킹</button>
      <button class="mbtn" data-act="me-open"><span class="mi">📋</span>내 기록</button>
    </div>
  </div>

  <!-- 마을 꾸미기 -->
  <div id="decoUI" class="screen hidden">
    <div class="dbar"><b>🏡 마을 꾸미기</b><span id="dHint"></span><button class="sbtn sm" data-act="shop-deco">상점</button><button class="gbtn sm" data-act="deco-done">다 했어요</button></div>
    <div class="dstore" id="dStore"></div>
  </div>

  <!-- 게임 HUD -->
  <div id="hud" class="screen hidden">
    <div class="hearts" id="hearts"></div>
    <div class="rbadge"><small>ROUND</small><b id="hRound">1</b></div>
    <div class="effects" id="effects"></div>
    <div class="rprog"><span id="hRoundTxt">1라운드</span><div class="bar"><i id="hBar"></i></div></div>
    <div class="hcoin" id="hCoinBox"><span class="coin"></span><b id="hCoin" style="font-weight:normal">0</b></div>
    <div class="combo" id="combo"></div>
    <div class="toast" id="toast"></div>
    <div class="slots" id="slots"></div>
    <div class="inbar"><input id="inp" aria-label="낱말 입력" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="40" placeholder="낱말을 치고 Enter!"></div>

function P(){const r=R.round,rr=Math.min(r,26),calm=1-.04*SAVE.up.calm;return{speed:30*(1+.065*(rr-1))*calm,interval:Math.max(.75,2.4-.1*(r-1)),max:Math.min(8,2+Math.floor(r/2))};}
const wordsFor=r=>{const n=Math.min(25,8+r);return r%5===0?Math.ceil(n/3):n;};
const lenF=w=>{const n=[...w.replace(/ /g,'')].length;return n<=3?1:n<=5?.85:n<=8?.72:.6;};
function tierMix(r){if(r<=2)return[[1,1]];if(r<=5)return[[1,.6],[2,.4]];if(r<=9)return[[1,.2],[2,.6],[3,.2]];if(r<=14)return[[2,.5],[3,.5]];return[[2,.3],[3,.5],[4,.2]];}
function pickTier(r){const mix=tierMix(r);let x=Math.random(),a=0;for(const[t,p]of mix){a+=p;if(x<=a)return t;}return mix[mix.length-1][0];}
function pickWord(){for(let k=0;k<25;k++){const t=pickTier(R.round);const d=R.deck[t]||(R.deck[t]=[]);if(!d.length)d.push(...shuffle(TIERS[t].slice()));const w=d.pop();if(!R.ents.some(e=>e.state==='alive'&&e.word===w))return w;}return TIERS[1][Math.floor(Math.random()*TIERS[1].length)];}
function roundHint(r){return r%5===0?'보스 별똥별이 나타나요! 문장을 치고 Enter':{1:'낱말을 치고 Enter나 스페이스바!',3:'조금 더 긴 낱말이 섞여요',6:'긴 낱말이 나오기 시작해요',10:'어려운 낱말이 많아져요',16:'속담 문장도 떨어져요!'}[r]||'';}

function startRun(bag){const u=SAVE.up;
 R={game:'meteor',round:0,phase:'count',phaseT:3,lastCount:4,maxHearts:5+u.hp,hearts:5+u.hp,shield:u.guard,bag:bag.slice(),bagSize:2+u.bag,
  ents:[],parts:[],shots:[],bolts:[],boss:null,deck:{},usedProv:new Set(),
  hits:0,misses:0,strokes:0,combo:0,maxCombo:0,active:0,
  coinsHit:0,coinsRound:0,coinsBoss:0,coinsGift:0,
  freezeT:0,slowT:0,doubleT:0,flash:0,flashW:0,shake:0,aim:-Math.PI/2,t:0,
  toSpawn:0,spawned:0,resolved:0,spawnT:0,giftAt:-1,roundT:0,banner:null,paused:false,over:false,overT:0,_eff:null,_hot:null,_prog:null};
 scr='game';hideAll();show('hud',true);inp.value='';updHUD();renderSlots();renderEffects();inp.focus();ac();}
function nextRound(){R.round++;R.toSpawn=wordsFor(R.round);R.spawned=0;R.resolved=0;R.spawnT=.6;R.roundT=0;R.phase='banner';R.phaseT=1.8;
 R.banner={t:`${R.round}라운드`,s:roundHint(R.round),t0:R.t};
 R.giftAt=Math.random()<.55+.05*SAVE.up.luck?rand(3,9):-1;
 if(R.round%5===0)SFX.boss();else SFX.go();updHUD();}
function roundClear(){const c=5*R.round*(R.doubleT>0?2:1);R.coinsRound+=c;R.phase='clear';R.phaseT=2.3;R.banner={t:`${R.round}라운드 클리어!`,s:`+${c} 코인`,t0:R.t};
 for(const e of R.ents)if(e.kind==='gift'&&e.state==='alive'){e.state='dead';puff(e.x,e.y,'#ffe066',8);}
 SFX.level();updHUD();}
function spawnMeteor(){const p=P(),word=pickWord();let x=640;for(let k=0;k<14;k++){x=rand(110,1170);if(!R.ents.some(e=>e.state==='alive'&&e.y<280&&Math.abs(e.x-x)<190))break;}const shape=[];for(let i=0;i<9;i++)shape.push(rand(.82,1.1));
 R.ents.push({kind:'m',word,x,y:150,vx:rand(-14,14),spd:p.speed*lenF(word)*rand(.9,1.1),rot:rand(0,6),rs:rand(-1,1),fade:0,shape,r:24,state:'alive'});R.spawned++;}
function spawnBoss(){const n=R.round/5;const pool=TIERS[4].filter(p=>!R.usedProv.has(p));const ph=shuffle(pool.length>=3?pool:TIERS[4].slice()).slice(0,3);ph.forEach(p=>R.usedProv.add(p));const shape=[];for(let i=0;i<12;i++)shape.push(rand(.88,1.06));
 const x=rand(430,850);R.boss={kind:'boss',phrases:ph,hp:3,word:ph[0],x,bx:x,y:205,vx:0,spd:8*(1+.08*(n-1))*(1-.04*SAVE.up.calm),rot:0,rs:.25,fade:0,shape,r:58,state:'alive',phase:0};R.ents.push(R.boss);}
function pickItem(){const pool=ITEM_IDS.filter(id=>!(id==='heart'&&R.hearts>=R.maxHearts));return pool[Math.floor(Math.random()*pool.length)];}
function spawnGift(){const word=pickWord(),dir=Math.random()<.5?1:-1,y=rand(200,320);R.ents.push({kind:'gift',word,item:Math.random()<.55?pickItem():null,x:dir>0?-40:W+40,y,base:y,vx:dir*rand(80,105),phase:0,state:'alive',spd:0});}

function update(dt){if(R.paused)return;R.t+=dt;
 R.shake=Math.max(0,R.shake-dt);R.flash=Math.max(0,R.flash-dt);R.flashW=Math.max(0,R.flashW-dt);
 updParts(dt);
 switch(R.phase){
  case 'count':{R.phaseT-=dt;const n=Math.ceil(R.phaseT);if(n!==R.lastCount){R.lastCount=n;if(n>0){showCount(String(n));SFX.tick();}}if(R.phaseT<=0){inp.focus();nextRound();}return;}
  case 'banner':R.phaseT-=dt;if(R.phaseT<=0){R.phase='play';if(R.round%5===0)spawnBoss();}break;
  case 'clear':R.phaseT-=dt;if(R.phaseT<=0)nextRound();break;
  case 'over':R.overT+=dt;if(R.overT>1.3&&!R.resultShown){R.resultShown=true;showResult();}R.ents=R.ents.filter(e=>e.state!=='dead');return;}
 if(R.freezeT>0)R.freezeT=Math.max(0,R.freezeT-dt);
 if(R.slowT>0)R.slowT=Math.max(0,R.slowT-dt);
 if(R.doubleT>0){R.doubleT=Math.max(0,R.doubleT-dt);if(!R.doubleT)updHUD();}
 renderEffects();updProg();
 if(R.phase==='play'){R.active+=dt;R.roundT+=dt;
  const p=P(),alive=R.ents.filter(e=>e.state==='alive'&&e.kind==='m').length;
  if(R.freezeT<=0&&R.spawned<R.toSpawn){R.spawnT-=dt;if(alive===0&&R.spawnT>.3)R.spawnT=.3;if(R.spawnT<=0&&alive<p.max){spawnMeteor();R.spawnT=p.interval*rand(.75,1.25);}}
  if(R.giftAt>0&&R.roundT>=R.giftAt){R.giftAt=-1;spawnGift();}}
 for(const e of R.ents)if(e.state==='alive')updEnt(e,dt);
 R.ents=R.ents.filter(e=>e.state!=='dead');
 if(R.phase==='play'&&!R.over&&R.spawned>=R.toSpawn&&!R.boss&&!R.ents.some(e=>e.state==='alive'&&e.kind==='m'))roundClear();}
function updEnt(e,dt){const k=e.kind==='gift'?1:(R.freezeT>0?0:(R.slowT>0?.45:1));
 if(e.kind==='gift'){e.phase+=dt;e.x+=e.vx*dt;e.y=e.base+Math.sin(e.phase*2)*14;if(Math.random()<dt*14)R.parts.push({x:e.x-Math.sign(e.vx)*22,y:e.y+rand(-8,8),vx:-e.vx*.2,vy:rand(-10,10),g:0,life:.6,max:.6,size:rand(3,6),c:'#ffe066',kind:'star',rot:0,vr:3});if(e.x<-70||e.x>W+70)e.state='dead';return;}
 e.fade=Math.min(1,e.fade+dt*3);
 if(e.kind==='boss'){e.phase+=dt*k;e.x=e.bx+Math.sin(e.phase*.6)*60;e.y+=e.spd*dt*k;e.rot+=e.rs*dt*k;if(e.y>=560&&!R.over)bossLand(e);return;}
 e.x+=e.vx*dt*k;if(e.x<70||e.x>1210){e.vx*=-1;e.x=Math.max(70,Math.min(1210,e.x));}e.y+=e.spd*dt*k;e.rot+=e.rs*dt*k;if(e.y>=604&&!R.over)leak(e);}

function submit(raw){if(!R||R.paused||R.over||R.phase==='count')return;const v=norm(raw);inp.value='';if(!v)return;const kv=v.replace(/ /g,'');
 let best=null;for(const e of R.ents){if(e.state!=='alive')continue;if(nkey(e.word)===kv){if(!best||e.y>best.y)best=e;}}
 if(best){hit(best);return;}
 const idx=R.bag.findIndex(id=>ITEMS[id].name===kv);if(idx>=0){useItem(idx);return;}
 miss();}
function laser(x,y){const lx=640,ly=618;R.aim=Math.atan2(y-ly,x-lx);R.shots.push({x1:lx+Math.cos(R.aim)*62,y1:ly+Math.sin(R.aim)*62,x2:x,y2:y,t:.2,max:.2});}
const hitCoin=()=>(1+Math.floor((R.round-1)/4))*(R.doubleT>0?2:1);
function hit(e){const st=strokes(e.word);R.hits++;R.strokes+=st;R.combo++;R.maxCombo=Math.max(R.maxCombo,R.combo);laser(e.x,e.y);SFX.shot();
 if(e.kind==='gift'){pow(e.x,e.y,.8);popGift(e);}
 else if(e.kind==='boss')bossHit(e);
 else{e.state='dead';R.resolved++;let c=hitCoin();if(R.combo>=5&&R.combo%5===0){c+=2;floatText(640,250,`콤보 ${R.combo}! +2`,'#ffe14d',40);}R.coinsHit+=c;coinText(e.x,e.y-62,c);pow(e.x,e.y,.8);burst(e.x,e.y,['#ff6b9a','#ffd84a','#7ad7ff','#9dff8a','#c79bff','#ffffff'],22,'star');SFX.pop();}
 updHUD();}
function bossHit(e){e.hp--;const c=5*(R.doubleT>0?2:1);R.coinsBoss+=c;coinText(e.x,e.y-90,c);pow(e.x,e.y,1.5);burst(e.x,e.y,['#ffd84a','#ff8a3d','#ffffff'],26,'star');R.shake=.25;SFX.pop();
 if(e.hp>0){e.word=e.phrases[3-e.hp];e.y=Math.max(205,e.y-70);floatText(e.x,e.y+90,`남은 체력 ${e.hp}`,'#ffffff',30);}
 else{e.state='dead';R.boss=null;const n=Math.max(1,Math.round(R.round/5)),b=20*n*(R.doubleT>0?2:1);R.coinsBoss+=b;
  burst(e.x,e.y,['#ff6b9a','#ffd84a','#7ad7ff','#9dff8a','#c79bff','#ffffff'],70,'star');floatText(640,300,'보스 격파!','#ffe14d',72);coinText(e.x,e.y-40,b);R.flashW=.25;R.shake=.45;SFX.level();
  if(R.hearts<R.maxHearts){R.hearts++;floatText(640,370,'하트 +1','#ff8fa3',40);}}
 updHUD();}
function bossLand(e){e.state='dead';R.boss=null;R.shake=.7;burst(e.x,e.y+20,['#ff8a3d','#ffd166','#ff5e3a','#8b6a55'],60,'circle');
 if(R.shield>0){R.shield--;floatText(e.x,e.y-60,'방패로 막았다!','#8be9ff',40);SFX.block();}
 else{R.hearts=Math.max(0,R.hearts-2);R.flash=.45;R.combo=0;SFX.hurt();floatText(e.x,e.y-60,'하트 -2','#ff8fa3',40);if(R.hearts<=0)finishRun('hearts');}
 updHUD();renderEffects();}
function miss(){if(R.phase!=='play')return;R.misses++;R.combo=0;inp.classList.remove('bad');void inp.offsetWidth;inp.classList.add('bad');SFX.miss();updHUD();}
function leak(e){e.state='dead';R.resolved++;
 if(R.shield>0){R.shield--;floatText(e.x,e.y-70,'막았다!','#8be9ff',36);burst(e.x,e.y,['#8be9ff','#ffffff','#a5b4fc'],16,'star');SFX.block();renderEffects();return;}
 R.combo=0;R.shake=.35;burst(e.x,e.y+10,['#ff8a3d','#ffd166','#ff5e3a','#8b6a55'],26,'circle');SFX.hurt();R.hearts--;R.flash=.3;
 if(R.hearts<=0){R.hearts=0;finishRun('hearts');}updHUD();}
function popGift(e){e.state='dead';burst(e.x,e.y,['#ff6b9a','#ffd84a','#7ad7ff','#9dff8a','#c79bff'],24,'star');
 if(e.item)giveItem(e.item,e.x,e.y);else{const c=(10+2*R.round)*(R.doubleT>0?2:1);R.coinsGift+=c;coinText(e.x,e.y-50,c);toast(`코인 주머니! +${c}`);SFX.coin();}}

/* ---------- 아이템 ---------- */
function giveItem(id,x,y){const it=ITEMS[id];SFX.item();
 if(R.bag.length<R.bagSize){R.bag.push(id);const i=R.bag.length-1,sw=R.bagSize>=4?76:94;R.parts.push({kind:'fly',x,y,x0:x,y0:y,x1:(R.bagSize>=4?12:24)+i*sw+40,y1:668,vx:0,vy:0,g:0,life:.7,max:.7,text:it.icon});renderSlots(i);toast(`${it.icon} ${it.name}! '${it.name}'${josa(it.name,'을','를')} 치면 써요`);}
 else{SAVE.inv[id]++;saveGame();toast(`가방이 가득 차서 ${it.name}${josa(it.name,'은','는')} 창고에 넣었어요`);}}
function useItem(i){if(!R||R.paused||R.over||R.phase==='count')return;const id=R.bag[i];if(!id)return;if(applyItem(id)===false)return;R.bag.splice(i,1);renderSlots();}
function boltTo(x,y){const pts=[],sx=x+rand(-60,60);for(let i=0;i<=8;i++){const k=i/8;pts.push([sx+(x-sx)*k+(i&&i<8?rand(-22,22):0),-10+(y+10)*k]);}R.bolts.push({pts,t:.45,max:.45});}
function applyItem(id){const it=ITEMS[id],mg=SAVE.up.magic;
 if(id==='heart'&&R.hearts>=R.maxHearts){toast('하트가 이미 가득해요');return false;}
 if(id==='bolt'&&!R.ents.some(e=>e.state==='alive'&&e.kind!=='gift')){toast('지금은 부술 별똥별이 없어요');return false;}
 const ay=(R.t-(R.lastAnn||-9)<.9)?(R.annY=(R.annY||300)+72):(R.annY=300);R.lastAnn=R.t;floatText(640,ay,`${it.icon} ${it.name}!`,'#ffffff',60);
 switch(id){
  case 'bolt':{SFX.bolt();R.flashW=.35;let n=0;for(const e of R.ents){if(e.state!=='alive'||e.kind==='gift')continue;boltTo(e.x,e.y);n++;if(e.kind==='boss'){bossHit(e);continue;}const c=hitCoin();R.coinsHit+=c;coinText(e.x,e.y-62,c);pow(e.x,e.y,.9);e.state='dead';R.resolved++;burst(e.x,e.y,['#ffe14d','#ffffff','#7ad7ff'],18,'star');}
   break;}
  case 'ice':R.freezeT=5+mg;SFX.freeze();for(let i=0;i<40;i++)R.parts.push({kind:'snow',x:rand(0,W),y:rand(-40,H*.6),vx:rand(-20,20),vy:rand(60,140),g:0,life:rand(1,1.8),max:1.8,size:rand(3,7),c:'#ffffff'});break;
  case 'slow':R.slowT=8+mg;SFX.freeze();break;
  case 'shield':R.shield+=3;SFX.block();break;
  case 'heart':R.hearts=Math.min(R.maxHearts,R.hearts+1);SFX.level();break;
  case 'double':R.doubleT=10;SFX.coin();break;}
 updHUD();renderEffects();return true;}

/* ---------- 끝과 보상 ---------- */
function finishRun(reason){if(R.over)return;R.over=true;R.phase='over';R.overT=reason==='quit'?1.3:0;R.reason=reason;SFX.end();inp.blur();inp.value='';
 const tot=R.hits+R.misses,acc=tot?Math.round(R.hits/tot*100):0,tasu=Math.round(R.strokes/(Math.max(R.active,1)/60));
 const base=R.coinsHit+R.coinsRound+R.coinsBoss+R.coinsGift,accB=(acc>=90&&R.hits>=10)?Math.round(base*.2):0,luckB=Math.round((base+accB)*.1*SAVE.up.luck);
 const g=SAVE.games[R.game],reached=Math.max(1,R.round),newRound=reached>g.bestRound,validT=R.active>=60&&acc>=80&&R.hits>=10,newTasu=validT&&tasu>g.bestTasu;
 const bestB=newRound&&g.plays>0?30:0,total=base+accB+luckB+bestB;
 SAVE.coins+=total;SAVE.stats.coins+=total;SAVE.stats.plays++;g.plays++;g.words+=R.hits;
 if(newRound){g.bestRound=reached;g.bestWords=R.hits;}else if(reached===g.bestRound&&R.hits>g.bestWords)g.bestWords=R.hits;
 if(newTasu)g.bestTasu=tasu;
 for(const id of R.bag)SAVE.inv[id]++;R.bag=[];
 saveGame();
 R.result={reached,acc,tasu,validT,newRound,newTasu,base,accB,luckB,bestB,total};
 setTimeout(syncPush,300);}

/* ================= 효과(파티클) ================= */
const POW=['뿅!','펑!','콩!','빵!','팡!'];
function burst(x,y,cols,n,kind){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),sp=rand(90,320);R.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,g:320,life:rand(.5,.9),max:.9,size:rand(5,11),c:cols[i%cols.length],kind,rot:rand(0,6),vr:rand(-6,6)});}}
function puff(x,y,c,n){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),sp=rand(20,90);R.parts.push({x:x+rand(-12,12),y:y+rand(-14,14),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-20,g:-20,life:rand(.5,.9),max:.9,size:rand(10,20),c,kind:'smoke'});}}
function floatText(x,y,text,c,size,coin){R.parts.push({x:Math.max(80,Math.min(W-80,x)),y,vx:0,vy:-60,g:0,life:1.1,max:1.1,text,c,size:size||36,kind:'text',coin});}
const coinText=(x,y,n)=>floatText(x,y,'+'+n,'#ffe14d',34,true);
function pow(x,y,size){R.parts.push({kind:'pow',x,y,vx:0,vy:0,g:0,life:.55,max:.55,text:POW[Math.floor(Math.random()*POW.length)],rot:rand(-.3,.3),size:size||1});}
function updParts(dt){for(const p of R.parts){if(p.kind==='fly'){p.life-=dt;const k=1-Math.max(0,p.life)/p.max,e=k*k*(3-2*k);p.x=p.x0+(p.x1-p.x0)*e;p.y=p.y0+(p.y1-p.y0)*e-Math.sin(k*Math.PI)*90;continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;p.life-=dt;if(p.vr)p.rot+=p.vr*dt;}
 R.parts=R.parts.filter(p=>p.life>0);for(const s of R.shots)s.t-=dt;R.shots=R.shots.filter(s=>s.t>0);for(const b of R.bolts)b.t-=dt;R.bolts=R.bolts.filter(b=>b.t>0);}
function drawParts(){for(const p of R.parts){const a=Math.max(0,p.life/p.max);ctx.globalAlpha=Math.min(1,a*1.6);
  if(p.kind==='text'){ctx.font=`${p.size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=8;ctx.lineJoin='round';ctx.strokeStyle='#3a1a25';ctx.strokeText(p.text,p.x,p.y);ctx.fillStyle=p.c;ctx.fillText(p.text,p.x,p.y);if(p.coin){const w=ctx.measureText(p.text).width;drawCoin(ctx,p.x-w/2-18,p.y,p.size*.36);}}
  else if(p.kind==='fly'){ctx.globalAlpha=1;ctx.font=`46px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.text,p.x,p.y);}
  else if(p.kind==='pow'){const age=1-p.life/p.max,sc=(age<.2?age/.2*1.15:1.15-(age-.2)*.3)*p.size;ctx.save();ctx.globalAlpha=age>.7?(1-age)/.3:1;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(sc,sc);ctx.beginPath();for(let i=0;i<28;i++){const q=i%2?22:36,an=i/28*Math.PI*2;ctx.lineTo(Math.cos(an)*q*1.18,Math.sin(an)*q);}ctx.closePath();ctx.fillStyle='#ffe14d';ctx.fill();ctx.lineWidth=4;ctx.lineJoin='round';ctx.strokeStyle='#e8590c';ctx.stroke();ctx.font=`28px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#c92a2a';ctx.fillText(p.text,0,1);ctx.restore();}
  else if(p.kind==='star'){ctx.fillStyle=p.c;starPath(ctx,p.x,p.y,p.size,p.size*.45,p.rot);ctx.fill();}
  else if(p.kind==='smoke'){ctx.globalAlpha=a*.8;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1.6-a*.6),0,7);ctx.fill();}
  else{ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.size*a+1,0,7);ctx.fill();}}
 ctx.globalAlpha=1;}

/* ================= 장면 그리기 ================= */
function drawHome(t){ctx.drawImage(BG.day,0,0,W,H);for(const cl of CLOUDS){const x=((cl.x+t*cl.v)%1560)-160;cloud(ctx,x,cl.y,cl.s);}
 drawVillage(ctx,SAVE?SAVE.deco.plots:DEFAULT_PLOTS,false);drawGuardian(ctx,640,618,-Math.PI/2+Math.sin(t*.8)*.6,t);}
let DSEL=null;
function drawPlots(){for(let i=0;i<12;i++){const x=plotX(i),id=SAVE.deco.plots[i];ctx.save();

let liveMem=null,pushing=false,pushAgain=false,pushRetry=0;
const tmo=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),ms))]);
const liveCached=()=>liveMem||store.get('taja2_live',null);
function mergeLists(...ls){const m=new Map();for(const L of ls)for(const e of(L||[])){if(!validEntry(e))continue;const o=m.get(e.i);if(!o||(+e.ts||0)>(+o.ts||0))m.set(e.i,e);}return[...m.values()];}
function ago(t){if(!t)return '';const s=(Date.now()-t)/1000;if(s<60)return '방금';if(s<3600)return `${Math.floor(s/60)}분 전`;const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;}
async function syncPush(){if(!SYNC||!SAVE)return false;if(pushing){pushAgain=true;return false;}pushing=true;
 const data=JSON.stringify(myEntry()),body=JSON.stringify({type:'record',data,sig:hash(SALT+'sync'+data)});let ok=false,res=null;
 try{res=await tmo(fetch(SYNC_URL,{method:'POST',body}),20000);}catch(e){res=null;}
 if(res){try{const j=await res.json();ok=!!(j&&j.ok);}catch(e){ok=false;}}
 else{try{await tmo(fetch(SYNC_URL,{method:'POST',body,mode:'no-cors'}),20000);ok=true;}catch(e){}}
 if(SAVE){if(ok)SAVE.syncAt=Date.now();SAVE.syncPending=!ok;saveGame();}
 pushing=false;
 if(pushAgain){pushAgain=false;syncPush();}
 else if(!ok&&pushRetry<3){pushRetry++;setTimeout(syncPush,15000+Math.random()*20000);}
 else if(ok)pushRetry=0;
 return ok;}
async function syncPull(){if(!SYNC)return null;try{const r=await tmo(fetch(SYNC_URL+(SYNC_URL.includes('?')?'&':'?')+'action=list&_='+Date.now()),20000);const j=await r.json();
 if(j&&j.ok&&Array.isArray(j.list)){liveMem={t:Date.now(),list:j.list.filter(validEntry)};store.set('taja2_live',liveMem);return liveMem;}}catch(e){}return null;}
function syncDelete(id){if(!SYNC||!id)return;const body=JSON.stringify({type:'delete',id,sig:hash(SALT+'del'+id)});fetch(SYNC_URL,{method:'POST',body}).catch(()=>fetch(SYNC_URL,{method:'POST',body,mode:'no-cors'}).catch(()=>{}));}
function entryVal(e,game,m){if(game==='total'){if(m==='r')return READY.reduce((a,gm)=>a+(+((e.g[gm.id]||{}).r)||0),0);const ts=READY.map(gm=>+((e.g[gm.id]||{}).t)||0).filter(x=>x>0);return ts.length?Math.round(ts.reduce((a,b)=>a+b,0)/ts.length):0;}const v=e.g[game]||{};return m==='r'?(+v.r||0):(+v.t||0);}
function rankTabs(pre,game,m){return `<div class="tabs">${READY.map(g=>`<button class="chip ${game===g.id?'on':''}" data-act="${pre}-game" data-g="${g.id}">${esc(g.name)}</button>`).join('')}<button class="chip ${game==='total'?'on':''}" data-act="${pre}-game" data-g="total">합산</button>
 <span style="width:18px"></span><button class="chip sm2 ${m==='r'?'on':''}" data-act="${pre}-metric" data-m="r">최고 라운드</button><button class="chip sm2 ${m==='t'?'on':''}" data-act="${pre}-metric" data-m="t">분당 타수</button></div>`;}
function rankHTML(list,game,m,meId){const rows=list.map(e=>({e,v:entryVal(e,game,m),w:game==='total'?0:(+((e.g[game]||{}).w)||0)})).sort((a,b)=>b.v-a.v||b.w-a.w||(+a.e.b||0)-(+b.e.b||0));
 if(!rows.length)return '<p class="empty">아직 기록이 없어요.</p>';
 const head=m==='r'?(game==='total'?'라운드 합계':'최고 라운드'):(game==='total'?'평균 분당 타수':'분당 타수'),unit=m==='r'?'라운드':'타';let rank=0,prev=null;
 return `<table class="rank"><thead><tr><th>순위</th><th>번호</th><th>이름</th><th>${head}</th><th>별지기</th></tr></thead><tbody>${rows.map((r,i)=>{if(!prev||r.v!==prev.v||r.w!==prev.w)rank=i+1;prev=r;const md=rank<=3&&r.v>0?`<span class="medal m${rank}">${rank}</span>`:rank;return `<tr class="${r.e.i===meId?'me':''}"><td>${md}</td><td>${esc(r.e.b||'-')}</td><td>${esc(r.e.n)}</td><td>${r.v?r.v+unit:'-'}</td><td>Lv.${esc(r.e.lv||1)}</td></tr>`;}).join('')}</tbody></table>`;}

function openRank(){rkErr=false;rkLoading=SYNC;renderRank();show('pRank',true);

function renderRank(){const live=SYNC?liveCached():null,cvw=store.get('taja2_classview',null),base=live||cvw;
 const list=(base&&Array.isArray(base.list)?base.list:[]).filter(e=>validEntry(e)&&e.i!==SAVE.id);list.push(myEntry());
 let note;
 if(SYNC)note=rkLoading?'우리 반 랭킹을 불러오는 중이에요…':rkErr?`지금은 반 랭킹에 연결하지 못했어요.${base?` ${ago(base.t)}에 불러온 랭킹을 보여 줘요.`:''}`:`자동 연동 · ${ago(base&&base.t)} 불러왔어요. 내 기록은 지금 기록으로 보여요.`;
 else{const d=cvw?new Date(cvw.t):null;note=cvw?`선생님이 ${d.getMonth()+1}월 ${d.getDate()}일에 만든 반 랭킹이에요. 내 기록은 지금 기록으로 보여요.`:'아직 반 랭킹 코드를 넣지 않았어요. 선생님께 받은 코드를 [내 기록]에서 넣으면 우리 반 순위가 보여요.';}

 const put=e=>{if(!validEntry(e)){bad++;return;}const i=d.list.findIndex(x=>x.i===e.i);if(i<0){d.list.push(e);add++;}else if((e.ts||0)>(d.list[i].ts||0)){d.list[i]=e;upd++;}};
 for(const c of codes){const r=dec(c);if(!r){bad++;continue;}if(r.pre==='TJ1')put(r.data);else if(Array.isArray(r.data.list))r.data.list.forEach(put);}
 const ok=store.set('taja2_teacher',d);tArm='';renderTeacher(null,{t:codes.length?`새로 ${add}명, 바뀐 기록 ${upd}명${bad?`, 잘못된 코드 ${bad}개`:''}${ok?'':' (이 화면에서는 저장되지 않아요)'}`:'코드를 찾지 못했어요. TJ1.로 시작하는 코드를 붙여 넣어 주세요.',ok:!!codes.length&&!bad});}

 full(){try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>ttoast('이 화면에서는 전체 화면을 쓸 수 없어요'));}}catch(e){ttoast('이 화면에서는 전체 화면을 쓸 수 없어요');}},
 't-open'(){openTeacher();},
 't-pin'(){const v=(($('tPin')||{}).value||'').trim();if(hash('pin:'+v+SALT)===PIN_H){TUNLOCK=true;tArm='';renderTeacher();teacherPull();}else{$('tPinMsg').textContent='비밀번호가 달라요';$('tPin').value='';}},
 't-close'(){show('pTeacher',false);tArm='';if(!SAVE)openReg();else if(scr==='home')goHome();},
 't-tab'(el){tTab=el.dataset.t;tArm='';renderTeacher();},
 'tr-game'(el){tG=el.dataset.g;renderTeacher();},'tr-metric'(el){tM=el.dataset.m;renderTeacher();},
 't-add'(){teacherAdd();},
 't-refresh'(){teacherPull();},
 'rk-refresh'(){openRank();},
 'me-push'(){renderMe(null,{t:'보내는 중…'});syncPush().then(ok=>{if(SAVE&&!$('pMe').classList.contains('hidden'))renderMe(null,ok?{t:'보냈어요!',ok:true}:{t:'보내지 못했어요. 잠시 뒤에 다시 해 보세요.'});});},
 't-classcode'(){const L=tList();if(!L.length){renderTeacher(null,{t:'먼저 학생 코드를 추가해 주세요'});return;}renderTeacher(enc('TJR1',{t:Date.now(),list:L.map(e=>({i:e.i,n:e.n,b:e.b,lv:e.lv,g:e.g,ts:e.ts}))}));},
 't-clear'(){if(tArm!=='clear'){tArm='clear';renderTeacher();return;}store.set('taja2_teacher',{list:[]});tArm='';renderTeacher(null,{t:'목록을 비웠어요',ok:true});},
 't-saveprof'(){const no=parseInt($('tNo').value,10),name=($('tName').value||'').trim().slice(0,8);if(!(no>=1&&no<=50)||!name){renderTeacher(null,{t:'번호(1~50)와 이름을 확인해 주세요'});return;}SAVE.no=no;SAVE.name=name;saveGame();syncPush();renderTeacher(null,{t:'저장했어요',ok:true});},
 't-give'(){const n=parseInt($('tGive').value,10);if(!n){renderTeacher(null,{t:'숫자를 써 주세요'});return;}SAVE.coins=Math.max(0,SAVE.coins+n);saveGame();renderTeacher(null,{t:`${n>0?'+':''}${n} 코인 → 지금 ${SAVE.coins} 코인`,ok:true});},
 't-reset'(){if(tArm!=='reset'){tArm='reset';renderTeacher();return;}if(SAVE)syncDelete(SAVE.id);try{localStorage.removeItem(SKEY);localStorage.removeItem('taja2_classview');localStorage.removeItem('taja2_live');}catch(e){}liveMem=null;SAVE=null;tArm='';show('pTeacher',false);goHome();}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){f(b);}});
$('slots').addEventListener('pointerdown',e=>{if(e.target.closest('.slot[data-i]'))e.preventDefault();});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){const id=e.target&&e.target.id;if(id==='rName'||id==='rNo'){e.preventDefault();ACT['reg-save']();}else if(id==='tPin'){e.preventDefault();ACT['t-pin']();}}});

/* 한글 입력(IME): 조합 중 Enter는 조합이 끝난 뒤 처리 */
let pendingEnter=false;
inp.addEventListener('compositionend',()=>{if(pendingEnter){pendingEnter=false;setTimeout(()=>submit(inp.value),0);}});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(e.isComposing||e.keyCode===229){pendingEnter=true;return;}submit(inp.value);}});
inp.addEventListener('input',()=>{const v=inp.value;if(!R)return;
 if(v.endsWith(' ')){const t=nkey(v);if(!t){inp.value='';return;}
  const spaced=R.ents.some(e=>e.state==='alive'&&e.word.includes(' ')),exact=R.ents.some(e=>e.state==='alive'&&nkey(e.word)===t)||R.bag.some(id=>ITEMS[id].name===t);
  if(exact||!spaced)submit(v);return;}
 if(/[a-z]/i.test(v))toast('한/영 키를 눌러 한글로 바꿔요!');});
inp.addEventListener('animationend',()=>inp.classList.remove('bad'));
document.addEventListener('keydown',e=>{if(scr!=='game'||!R)return;if(e.key==='Escape'){e.preventDefault();if(R.over)return;R.paused?ACT.resume():ACT.pause();return;}if(!R.paused&&!R.over&&document.activeElement!==inp)inp.focus();});
function toStage(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{if(scr==='game'&&R&&!R.paused&&!R.over){e.preventDefault();inp.focus();}else if(scr==='deco'){const p=toStage(e);decoClick(p.x,p.y);}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scr==='game'&&R&&!R.over&&!R.paused)ACT.pause();});
window.addEventListener('resize',fit);

/* ================= 시작 ================= */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;ANIM_T+=dt;ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
 if(scr==='game'&&R){update(dt);if(R)drawGame();}else{drawHome(ANIM_T);if(scr==='deco'&&SAVE)drawPlots();}
 requestAnimationFrame(loop);}
fit();goHome();
if(SYNC&&SAVE)setTimeout(syncPush,1500);
requestAnimationFrame(loop);
})();
</script>
</body>
