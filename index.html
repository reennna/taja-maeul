<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 타자 마을</title>
<script>
/* ============================================================
   반 랭킹 자동 연동 주소
   구글 Apps Script 웹 앱 주소(https://script.google.com/macros/s/…/exec)를
   아래 따옴표 안에 붙여 넣으면 자동 연동이 켜져요. 비워 두면 꺼져요.
   ============================================================ */
window.TAJA_SYNC_URL = 'https://script.google.com/macros/s/AKfycbw6gZXufTAuKirWz9M2cmYoUgGc7UKmGDJVymQb9nPFBIuTUBK718gx6SfSFFVN_T7T/exec';
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a1f2b;--steel:#2f2f35}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#16202c;overflow:hidden;font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;word-break:keep-all}
input,textarea{user-select:text;-webkit-user-select:text;font-family:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#7cc6ee}
#cv{position:absolute;left:0;top:0;width:1280px;height:720px}
.screen{position:absolute;inset:0}
.hidden{display:none!important}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc928 55%,#e09a00);border:.09em solid #9a6400;box-shadow:inset 0 0 0 .13em rgba(255,255,255,.35);vertical-align:-.14em}

/* ---------- 홈 ---------- */
#home{pointer-events:none}
#home>*{pointer-events:auto}
.logo2{position:absolute;left:0;right:0;top:10px;text-align:center;pointer-events:none!important;line-height:1;white-space:nowrap}
.logo2 span{display:inline-block;paint-order:stroke fill;filter:drop-shadow(0 3px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 8px 6px rgba(0,0,0,.22))}
.logo2 .l1{font-size:34px;color:#ffae1f;-webkit-text-stroke:9px var(--ink);transform:rotate(-5deg);margin-right:12px;vertical-align:18px}
.logo2 .l2{font-size:72px;color:#ff5fa8;-webkit-text-stroke:13px var(--ink);letter-spacing:3px}
.pcard{position:absolute;left:16px;top:14px;width:290px;background:rgba(255,255,255,.94);border:4px solid var(--ink);border-radius:22px;padding:8px 16px 10px;box-shadow:0 5px 0 var(--ink)}
.pname{font-size:30px;color:#2a2a30;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:19px;color:#7b4b58;line-height:1.25;white-space:pre-line}
.pcoin{margin-top:2px;font-size:30px;color:#2a2a30}
.pskin{position:absolute;right:8px;top:10px;width:72px;height:63px;pointer-events:none}
.pcard .pname,.pcard .pmeta{margin-right:62px}
.updnote{position:absolute;left:50%;top:118px;transform:translateX(-50%);background:rgba(40,20,30,.94);color:#fff;font-size:28px;padding:12px 30px;border-radius:999px;border:3px solid #ffd43b;white-space:nowrap;z-index:20;pointer-events:none!important;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.updnote b{color:#ffd43b;font-weight:normal}
.verline{font-size:15px;color:#9a9ca5;margin-top:6px}
table.rank .vok{color:#2b8a3e;font-size:17px}
table.rank .vold{color:#c2410c;font-size:17px}
.hreset{position:absolute;right:18px;bottom:122px;font-size:19px;background:rgba(255,255,255,.94);border:3px solid var(--ink);border-radius:999px;padding:3px 14px;box-shadow:0 3px 0 var(--ink)}
.topbtns{position:absolute;right:18px;top:14px;display:flex;gap:10px}
.ibtn{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc928 60%,#e59a00);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;position:relative}
.ibtn svg{width:30px;height:30px;fill:var(--ink)}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ibtn .tip{position:absolute;top:66px;white-space:nowrap;background:rgba(40,20,30,.88);color:#fff;font-size:18px;padding:3px 10px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .15s}
.ibtn:hover .tip{opacity:1}
.homebar{position:absolute;left:16px;right:16px;bottom:14px;height:98px;display:flex;gap:12px;align-items:stretch}
.playbtn{flex:0 0 290px;border-radius:999px;background:linear-gradient(#ff8cc0,#ff4f9a);border:5px solid var(--ink);box-shadow:0 7px 0 var(--ink);font-size:44px;color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;white-space:nowrap}
.playbtn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.hb{flex:1 1 0;min-width:0;border-radius:24px;background:linear-gradient(#ffffff,#e8f4ff);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-size:23px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;white-space:nowrap}
.hb .mi{font-size:32px}
.hb.pz{background:linear-gradient(#fff6d6,#ffe08a)}
.hb:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.hometip{position:absolute;left:50%;bottom:122px;transform:translateX(-50%);font-size:19px;color:#fff;background:rgba(20,60,90,.55);border-radius:999px;padding:3px 16px;pointer-events:none!important;white-space:nowrap}
#ttoast{position:absolute;left:50%;top:548px;transform:translateX(-50%);background:rgba(40,20,30,.93);color:#fff;font-size:26px;padding:10px 26px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:50}
#ttoast.show{opacity:1}
#ttoast.top{top:92px}
#cv{touch-action:none}
.form select{height:58px;border:4px solid var(--steel);border-radius:16px;font-size:26px;padding:0 6px;outline:none;width:132px;background:#fff;font-family:inherit;color:#2a2a30}
.form.reg input{width:230px}
.form.reg input[type=number]{width:100px}
.namehelp{font-size:20px;color:#5d4b2a;background:#fff8db;border:3px dashed #f0b400;border-radius:14px;padding:8px 14px;margin:4px auto 2px;max-width:780px;line-height:1.4}
.namehelp b{font-weight:normal;color:#d6336c}

/* ---------- 마을 꾸미기 · 광장 ---------- */
#decoUI{pointer-events:none}
#decoUI>*{pointer-events:auto}
.dbar{position:absolute;left:12px;right:12px;top:10px;height:68px;background:rgba(255,255,255,.95);border:4px solid var(--ink);border-radius:22px;display:flex;align-items:center;gap:10px;padding:0 12px}
.dbar b{font-size:28px;font-weight:normal;white-space:nowrap}
#dHint{font-size:16px;color:#6a3b48;flex:1;line-height:1.2;overflow:hidden;max-height:42px;min-width:0}
.dextra{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.dcoin{font-size:24px;background:#2a2a30;color:#fff;border-radius:999px;padding:2px 14px;white-space:nowrap}
.dchip{font-size:18px;background:#fff3b8;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;white-space:nowrap}
.dbar .gbtn,.dbar .sbtn{display:inline-block;width:auto;flex:0 0 auto;margin:0;white-space:nowrap}
.dzoom{position:absolute;right:14px;top:92px;display:flex;flex-direction:column;gap:8px}
.dzoom button{width:52px;height:52px;border-radius:16px;background:#fff;border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center}
.dzoom button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.dact{position:absolute;right:22px;bottom:140px;background:#fffbea;border:3px solid var(--ink);border-radius:16px;padding:4px 8px;display:flex;gap:6px;align-items:center;white-space:nowrap;box-shadow:0 3px 0 var(--ink);z-index:2}
.dact b{font-size:22px;font-weight:normal;margin:0 4px}
.dact span{font-size:18px;color:#6a3b48}
.dact .sbtn{display:inline-block;width:auto;margin:0;font-size:20px;padding:2px 12px;box-shadow:0 3px 0 var(--ink)}
.dpal{position:absolute;left:12px;right:12px;bottom:10px;height:182px;background:rgba(255,255,255,.94);border:4px solid var(--ink);border-radius:22px;padding:6px 10px 8px;display:flex;flex-direction:column;gap:6px}
.dcats{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;min-height:36px}
.dnote{font-size:17px;color:#7b4b58;margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnote.wt{color:#1c7ed6;margin-left:14px}
.dstore{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;flex:1;align-items:center;padding:2px 2px 4px}
.dstore::-webkit-scrollbar{height:9px}.dstore::-webkit-scrollbar-thumb{background:#c9ccd3;border-radius:9px}.dstore::-webkit-scrollbar-track{background:transparent}
.dcard{flex:0 0 auto;width:102px;height:108px;border:3px solid var(--steel);border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;line-height:1.1}
.dcard.on{background:#fff3b8;border-color:#d6336c;box-shadow:0 0 0 3px #d6336c}
.dcard.buy{background:#f3f4f7}
.dcard canvas{width:74px;height:74px}
.dcard span{font-size:16px;white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.dcard i{position:absolute;right:5px;top:4px;font-style:normal;font-size:17px;background:var(--ink);color:#fff;border-radius:999px;padding:0 7px}
.dcard i.pr{background:#fff3b8;color:#4a1f2b;border:2px solid #e0a800;font-size:15px;padding:0 6px 0 4px}
.dcard i.pr .coin{margin-right:2px}
.dcard em{position:absolute;left:5px;top:5px;font-style:normal;font-size:13px;color:#fff;background:#4fa3d6;border-radius:6px;padding:0 4px}
.dcard em.wt{background:#1c7ed6}
.dcard i.pr{font-size:14px;padding:0 5px 0 3px}
.dcard .nw{position:absolute;left:4px;bottom:22px;font-weight:normal;font-size:12px;color:#fff;background:#ff5fa8;border-radius:6px;padding:0 4px;line-height:1.3}
.scard{position:relative}
.scard .nwb{position:absolute;left:8px;top:8px;font-size:14px;color:#fff;background:#ff5fa8;border:2px solid var(--ink);border-radius:8px;padding:0 6px;line-height:1.3}
.sell{margin-top:4px;font-size:16px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;color:#7b4b58;box-shadow:0 2px 0 var(--ink)}
.sell.arm{background:#ffe3e3;color:#c92a2a}
.ibtn .seaic{font-size:28px;line-height:1}
.ibtn.off .seaic{opacity:.35;filter:grayscale(1)}
.dcard.tile .sw{display:block;width:64px;height:34px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);margin:10px 0 14px}
.dempty{font-size:21px;color:#7b4b58;padding:0 20px}
/* 우리 반 기념비 */
.monbar{position:absolute;left:14px;top:150px;width:300px;background:rgba(255,255,255,.94);border:3px solid var(--ink);border-radius:16px;padding:6px 12px 8px;font-size:16px;color:#4a1f2b;line-height:1.35;display:flex;flex-direction:column;gap:1px}
.monbar b,.monpanel b{font-size:21px;font-weight:normal}
.monbar small,.monpanel small{font-size:15px;color:#7b4b58}
.mbar{height:12px;border-radius:999px;background:#e9ecef;border:2px solid var(--ink);margin:3px 0;overflow:hidden}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd43b,#ff8cc0)}
.monpanel{background:#fff;border:3px solid var(--steel);border-radius:16px;padding:8px 16px;max-width:640px;margin:6px auto;display:flex;flex-direction:column;gap:2px;font-size:19px;color:#4a1f2b}
.grid.g5{grid-template-columns:repeat(5,1fr)}

/* ---------- HUD ---------- */
#hud{pointer-events:none}
#hud .inbar,#hud .pbtn,#hud .qbtn,#hud .slots{pointer-events:auto}
.hearts{position:absolute;left:84px;top:30px;height:46px;padding:0 36px 0 30px;background:linear-gradient(90deg,rgba(18,18,24,.88) 75%,rgba(18,18,24,0));display:flex;gap:3px;align-items:center;border-radius:0 24px 24px 0}
.hearts i{display:block;width:27px;height:25px}
.hearts svg{width:100%;height:100%;fill:#ff3d55;stroke:#7a0f1c;stroke-width:1.5}
.hearts i.off svg{fill:#4b4b55;stroke:#2a2a30}
.rbadge{position:absolute;left:18px;top:12px;width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c2,#ffcd3c 55%,#e08e00);border:4px solid var(--steel);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:#2a2a30;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.rbadge small{font-size:15px}.rbadge b{font-size:40px;font-weight:normal}
.rprog{position:absolute;left:490px;top:16px;width:300px;background:rgba(18,18,24,.86);border:3px solid #fff;border-radius:20px;padding:6px 14px 10px;color:#fff;text-align:center;font-size:24px}
.rprog .bar{height:12px;border-radius:999px;background:#454552;margin-top:4px;overflow:hidden}
.rprog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ad7ff,#ffe066);border-radius:999px;transition:width .2s}
.hcoin{position:absolute;right:18px;top:22px;min-width:200px;height:60px;background:linear-gradient(90deg,rgba(15,15,18,0),#111 25%);color:#fff;font-size:42px;text-align:right;padding-right:20px;line-height:60px;border-radius:12px}
.hcoin .coin{margin-right:10px}
.hcoin.dbl{color:#ffe14d}
.combo{position:absolute;right:28px;top:90px;font-size:32px;color:#ffe14d;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill}
.effects{position:absolute;left:112px;top:84px;display:flex;gap:6px}
.eff{background:rgba(18,18,24,.86);color:#fff;border-radius:999px;padding:3px 14px;font-size:22px}
.inbar{position:absolute;left:320px;top:638px;width:640px;height:66px}
#inp{width:100%;height:100%;border-radius:22px;border:4px solid var(--steel);background:linear-gradient(#ffffff,#e6eaf0);font-size:34px;text-align:center;color:#222;outline:none;box-shadow:0 5px 0 var(--steel)}
#inp::placeholder{color:#a3a9b3;font-size:24px}
#inp.bad{animation:shake .32s}
#inp.caps{border-color:#f59f00}
.capsnote{position:absolute;left:340px;top:604px;padding:2px 14px 4px;border-radius:12px 12px 0 0;background:#ffe066;border:3px solid var(--steel);border-bottom:none;font-size:20px;color:#4a1f2b;display:none}
.capsnote.show{display:block}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.pbtn{position:absolute;left:986px;top:640px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c3c9d0 55%,#7d858e);border:4px solid var(--steel);box-shadow:0 4px 0 var(--steel);display:flex;align-items:center;justify-content:center}
.pbtn svg{width:26px;height:26px;fill:#26262c}
/* 멈춤 (2026-11-12): 남은 횟수 · 다 쓰면 꺼짐 · 멈춘 동안 낱말이 보이지 않게 */
.pbtn .pleft{position:absolute;right:-9px;top:-9px;min-width:28px;height:28px;padding:0 5px;border-radius:14px;background:#ffe066;border:3px solid var(--steel);font-size:17px;line-height:22px;color:#2a2a30;font-weight:normal;text-align:center}
.pbtn.off{opacity:.45}
.pbtn.off .pleft{background:#dee2e6}
/* 그만하기 (2026-11-12-03): 멈춤을 다 쓰면 멈춤 단추 대신 나와요. 누르면 묻지 않고 바로 끝나요 */
.pbtn.gone{display:none}
.qbtn{position:absolute;left:984px;top:641px;height:62px;padding:0 26px 0 20px;border-radius:31px;background:linear-gradient(#ff8787,#e03131);border:4px solid var(--steel);box-shadow:0 4px 0 var(--steel);color:#fff;font-size:27px;text-shadow:0 2px 0 rgba(90,10,10,.35);display:none;align-items:center;gap:9px;white-space:nowrap}
.qbtn.on{display:flex}
.qbtn svg{width:22px;height:22px;fill:#fff;filter:drop-shadow(0 2px 0 rgba(90,10,10,.35))}
.qbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--steel)}
#pPause{background:#141a33}
.pzleft{font-size:22px;color:#4b4f5c;margin:0 0 10px;line-height:1.45}
.pzleft.zero{color:#c2410c}
.toast{position:absolute;left:50%;top:552px;transform:translateX(-50%);background:rgba(30,20,40,.93);color:#fff;font-size:26px;padding:10px 26px;border-radius:999px;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:210px;color:#fff;-webkit-text-stroke:20px var(--ink);paint-order:stroke fill;pointer-events:none;opacity:0}
#count.pop{animation:pop .9s ease-out forwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.15);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.slots{position:absolute;left:24px;top:632px;display:flex;gap:8px}
.slot{width:86px;height:74px;border-radius:16px;border:4px solid var(--steel);background:rgba(255,255,255,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--steel);line-height:1.05}
.slot .ic{font-size:30px}
.slot .nm{font-size:19px;color:#2a2a30;white-space:nowrap}
.slot.empty{background:rgba(255,255,255,.35);border-style:dashed;box-shadow:none}
.slot.empty .nm{color:rgba(40,40,48,.65);font-size:17px}
.slot.new{animation:slotpop .6s}
.slot.hot{outline:4px solid #d6336c;outline-offset:2px}
@keyframes slotpop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
#hud .slots.s4{left:12px;gap:4px}
#hud .slots.s4 .slot{width:72px}

/* ---------- 패널 ---------- */
.overlay{position:absolute;inset:0;background:rgba(10,15,30,.5);display:flex;align-items:center;justify-content:center;z-index:10}
.panel{background:linear-gradient(#ffffff,#dde2e9);border:5px solid var(--steel);border-radius:32px;box-shadow:0 10px 0 var(--steel),0 24px 50px rgba(0,0,0,.4);padding:24px 36px 22px;text-align:center;width:500px;max-height:690px;overflow:auto}
.panel.wide{width:860px}
.panel.xl{width:1160px}
.panel h2{font-size:46px;font-weight:normal;margin-bottom:6px;color:#2a2a30}
.panel h3{font-size:26px;font-weight:normal;margin:10px 0 4px;color:#2a2a30;text-align:left}
.panel .sub{font-size:21px;color:#5d5f68;margin-bottom:10px}
.gbtn,.sbtn{display:block;width:100%;margin:10px 0;padding:8px 24px;font-size:32px;border:4px solid var(--ink);border-radius:999px;box-shadow:0 5px 0 var(--ink)}
.gbtn{background:linear-gradient(#ffe36b,#f7b500)}
.sbtn{background:linear-gradient(#ffffff,#e9e9ee);font-size:27px}
.gbtn small{display:block;font-size:18px;opacity:.75;margin-top:-2px}
.gbtn:active,.sbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.inline{display:inline-block;width:auto;margin:0 6px;min-width:170px}
.sm{font-size:22px;padding:4px 16px;min-width:0;margin:0;box-shadow:0 3px 0 var(--ink)}
.btnrow{margin-top:14px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.linkbtn{font-size:20px;color:#6b6d75;text-decoration:underline;margin-top:6px}
.form{display:flex;gap:14px;justify-content:center;margin:10px 0}
.form label{display:flex;flex-direction:column;align-items:flex-start;font-size:20px;color:#5d5f68;gap:4px}
.form input{height:58px;border:4px solid var(--steel);border-radius:16px;font-size:30px;text-align:center;outline:none;width:260px}
.form input[type=number]{width:110px}
.msg{font-size:21px;color:#d0263a;min-height:26px}
.ok{color:#2b8a3e}
.tabs{display:flex;justify-content:center;gap:8px;margin:6px 0 10px;flex-wrap:wrap}
.chip{border:3px solid var(--ink);border-radius:999px;background:#fff;padding:4px 16px;font-size:23px;white-space:nowrap}
.chip.on{background:linear-gradient(#ffe36b,#f7b500);box-shadow:0 3px 0 var(--ink)}
.chip.sm2{font-size:20px;padding:3px 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 10px}
.tile{background:#fff;border:3px solid var(--steel);border-radius:18px;padding:6px 4px}
.tile small{display:block;font-size:19px;color:#6b6d75}

<script>
(()=>{
'use strict';
// 게임 버전: 새 파일을 만들 때마다 꼭 올려요(날짜-그날 몇 번째). 학생 크롬북이 이 번호로 새 버전을 알아채요.
const APP_VER='2026-11-13-01';
const vnum=v=>Number(String(v||'').replace(/\D/g,''))||0;
const $=id=>document.getElementById(id);
const W=1280,H=720,GROUND=650;
const FONT="'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif";
const stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d'),inp=$('inp');
let scale=1,dpr=1,RS=0,ANIM_T=0;

/* ================= 저장 ================= */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const OPT=Object.assign({sound:true},store.get('taja2_opt',{}));
const saveOpt=()=>store.set('taja2_opt',OPT);
const rid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);

/* ================= 데이터 ================= */
// 게임마다 기록과 랭킹이 따로 있어요. 한글판 id(meteor)는 예전 기록이 이어지도록 바꾸지 않아요.
const GAMES=[
 {id:'meteor',name:'별똥별 방어전 한글',short:'별똥별 한글',lang:'ko',ready:true},
 {id:'meteor_en',name:'별똥별 방어전 영어',short:'별똥별 영어',lang:'en',ready:true}];
const READY=GAMES.filter(g=>g.ready);
// 게임 고르기 카드: 한 카드 안의 버튼으로 한글·영어를 골라요
const CARDS=[
 {name:'별똥별 방어전',desc:'우리 마을로 떨어지는 별똥별을 낱말로 막아요!',thumb:'meteor',modes:[['meteor','한글',''],['meteor_en','영어','en']]},
 {name:'새 게임 준비 중',desc:'곧 새로운 타자 게임이 와요'},
 {name:'새 게임 준비 중',desc:'기대해 주세요!'}];
const gameName=id=>(GAMES.find(g=>g.id===id)||{name:id}).name;

function paintAt(i,j){const g=ED.paint,d=SAVE.deco;if(!g||i<0||j<0||i>=d.n||j>=d.n)return;const key=i+','+j;if((d.ground[key]||'grass')===g)return;

function clampCam(){const n=edN(),z=ED.cam.z,L=ED.cam.x-n*IW*z,Rr=ED.cam.x+n*IW*z,T=ED.cam.y-130*z,B=ED.cam.y+(n*TLH+22)*z;
 if(Rr<220)ED.cam.x+=220-Rr;if(L>1060)ED.cam.x-=L-1060;if(B<220)ED.cam.y+=220-B;if(T>500)ED.cam.y-=T-500;}
function edZoom(f,p){p=p||{x:640,y:316};const z0=ED.cam.z,z=Math.max(.35,Math.min(2.6,z0*f)),k=z/z0;ED.cam.x=p.x-(p.x-ED.cam.x)*k;ED.cam.y=p.y-(p.y-ED.cam.y)*k;ED.cam.z=z;clampCam();}
function edPoint(e){const p=toStage(e),z=ED.cam.z,wx=(p.x-ED.cam.x)/z,wy=(p.y-ED.cam.y)/z;return{sx:p.x,sy:p.y,wx,wy,fi:(wy/IH+wx/IW)/2,fj:(wy/IH-wx/IW)/2};}
function edHover(pt){const s=ED.carry?DECO[ED.carry.k].s:1;ED.hover={ti:Math.floor(pt.fi),tj:Math.floor(pt.fj),oi:Math.floor(pt.fi-(s-1)/2),oj:Math.floor(pt.fj-(s-1)/2)};}
function inPoly(x,y,P){let inside=false;for(let a=0,b=P.length-1;a<P.length;b=a++){const[xa,ya]=P[a],[xb,yb]=P[b];if((ya>y)!==(yb>y)&&x<(xb-xa)*(y-ya)/(yb-ya)+xa)inside=!inside;}return inside;}
function objPoly(o){const s=sizeOf(o),h=(o.k==='monument'?110+(o.lv||1)*12:o.k==='mlamp'?70:DECO[o.k].h)+14,H=Math.max(10,h-s*IH),T=IP(o.i,o.j),Rt=IP(o.i+s,o.j),B=IP(o.i+s,o.j+s),L=IP(o.i,o.j+s);return[L,B,Rt,up(Rt,H),up(T,H),up(L,H)];}
// 누른 곳에 실제로 그려진 장식을 골라요 (앞에 있는 것부터, 1픽셀 캔버스에 그려 보고 확인)
const PICK=document.createElement('canvas');PICK.width=PICK.height=1;const pctx=PICK.getContext('2d',{willReadFrequently:true});
function pixelHit(o,wx,wy){pctx.setTransform(1,0,0,1,0,0);pctx.clearRect(0,0,1,1);pctx.setTransform(1,0,0,1,-wx,-wy);footDiamond(pctx,o.i,o.j,sizeOf(o),'#000');drawObj(pctx,o,ANIM_T);return pctx.getImageData(0,0,1,1).data[3]>24;}
function hitObj(pt){const list=edObjs().filter(o=>!o.hidden&&o.k!=='mlamp').sort(depthCmp);for(let q=list.length-1;q>=0;q--){const o=list[q];if(inPoly(pt.wx,pt.wy,objPoly(o))&&pixelHit(o,pt.wx,pt.wy))return o;}return null;}
function edDown(e){const pt=edPoint(e);PTRS.set(e.pointerId,{x:pt.sx,y:pt.sy});
 if(PTRS.size>=2){if(ED.carry&&ED.carry.drag)edCancel();const[a,b]=[...PTRS.values()];ED.drag={type:'pinch',d0:Math.max(10,Math.hypot(a.x-b.x,a.y-b.y)),m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},cam0:Object.assign({},ED.cam)};return;}
 try{cv.setPointerCapture(e.pointerId);}catch(_){}
 edHover(pt);const h=ED.hover,n=edN(),onIsland=h.ti>=0&&h.tj>=0&&h.ti<n&&h.tj<n,alt=e.button===1||e.button===2;
 const hit=(!ED.carry&&!ED.paint&&!alt)?hitObj(pt):null;
 ED.drag={type:alt?'pan':ED.paint&&onIsland?'paint':(hit&&ED.mode==='deco')?'obj':'pan',sx:pt.sx,sy:pt.sy,cx:ED.cam.x,cy:ED.cam.y,moved:false,hit};

function edMove(e){const pt=edPoint(e),d=ED.drag;if(PTRS.has(e.pointerId))PTRS.set(e.pointerId,{x:pt.sx,y:pt.sy});
 if(d&&d.type==='pinch'){if(PTRS.size<2)return;const[a,b]=[...PTRS.values()],m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};ED.cam=Object.assign({},d.cam0);edZoom(Math.hypot(a.x-b.x,a.y-b.y)/d.d0,d.m0);ED.cam.x+=m.x-d.m0.x;ED.cam.y+=m.y-d.m0.y;clampCam();return;}
 if(e.target===cv||d)edHover(pt);if(!d)return;
 const dx=pt.sx-d.sx,dy=pt.sy-d.sy;if(!d.moved&&Math.hypot(dx,dy)>6)d.moved=true;
 if(d.type==='pan'){if(d.moved){ED.cam.x=d.cx+dx;ED.cam.y=d.cy+dy;clampCam();}}

/* 우리 반 광장 (구글 시트로 같은 반 친구들과 함께 써요) */
async function pzReq(body){try{const r=await tmo(fetch(SYNC_URL,{method:'POST',body:JSON.stringify(body)}),20000);return await r.json();}catch(e){return null;}}
function plazaTick(){if(ED&&ED.mode==='plaza'&&!ED.pz.busy&&!ED.pz.loading&&!document.hidden&&Date.now()-ED.pz.last>15000)plazaPull(true);}
async function plazaFetch(ed){if(ed.admin&&TPIN){const j=await pzReq({type:'plaza_full',gr:ed.gr,cl:ed.cl,pin:TPIN});if(j&&j.ok&&Array.isArray(j.items))return j;}
 try{const r=await tmo(fetch(`${SYNC_URL}${SYNC_URL.includes('?')?'&':'?'}action=plaza&gr=${ed.gr}&cl=${ed.cl}${ed.visit?'&visit=1':''}&_=${Date.now()}`),20000);const j=await r.json();if(j&&j.ok&&Array.isArray(j.items))return j;}catch(e){}return null;}
async function plazaPull(quiet){const ed=ED;if(!ed||ed.mode!=='plaza'||ed.pz.loading)return;ed.pz.loading=true;renderEdBar();const res=await plazaFetch(ed),items=res&&res.items;
 if(ED!==ed)return;ed.pz.loading=false;ed.pz.last=Date.now();
 if(res&&res.mon)monSet(ed,res.mon);
 if(res&&res.pz)pzSetInfo(ed,res.pz);
 if(items){const back=setPlaza(items);if(back)ttoast(`광장에서 치워진 내 장식 ${back}개가 창고로 돌아왔어요`);if(!ed.visit&&!ed.admin&&SAVE&&SAVE.pzTry)giveCheck();}
 else if(!quiet)ttoast('광장을 불러오지 못했어요. 인터넷 연결을 확인해 주세요');
 edRefresh();}
function setPlaza(items){const ed=ED,sel=ed.sel;
 ed.pz.items=items.filter(it=>it&&DECO[it.k]&&Number.isFinite(+it.x)&&Number.isFinite(+it.y)).map(it=>({x:+it.x,y:+it.y,k:String(it.k),f:+it.f?1:0,o:ed.visit?'':String(it.o||''),n:ed.visit?'':String(it.n||'')}));
 const L=pzL();ed.pzObjs=pzFixed().concat(ed.pz.items.map(it=>({k:it.k,i:it.x+L,j:it.y+L,x:it.x,y:it.y,f:it.f,o:it.o,n:it.n})));
 ed.sel=sel?ed.pzObjs.find(o=>o.k===sel.k&&(o.x==null||(o.x===sel.x&&o.y===sel.y)))||null:null;
 return(!ed.admin&&!ed.visit&&SAVE&&ed.gr===SAVE.gr&&ed.cl===SAVE.cl)?plazaReconcile():0;}
// 내 창고와 광장을 맞춰요: 광장에서 없어진 내 장식은 창고로 돌아오고, 새로 놓인 내 장식은 창고에서 빠져요.
function plazaReconcile(){const lab=plazaLabel(SAVE.gr,SAVE.cl),me=myTag(),st=SAVE.deco.stock,mine=ED.pz.items.filter(it=>it.o===me),used=new Set(),keep=[];let back=0,changed=false;
 for(const r of SAVE.pz[lab]||[]){if(!DECO[r.k]){keep.push(r);continue;}const q=mine.findIndex((it,ix)=>!used.has(ix)&&it.x===r.x&&it.y===r.y&&it.k===r.k);if(q>=0){used.add(q);keep.push(r);}else{st[r.k]=(st[r.k]||0)+1;back++;changed=true;}}
 mine.forEach((it,ix)=>{if(used.has(ix))return;keep.push({x:it.x,y:it.y,k:it.k});if(st[it.k]>0&&!--st[it.k])delete st[it.k];changed=true;});
 SAVE.pz[lab]=keep;if(changed)saveGame();return back;}
async function plazaPut(k,i,j,f){const ed=ED;if(ed.pz.busy)return;const lab=plazaLabel(ed.gr,ed.cl),nm=DECO[k].name;
 if(ed.pz.items.filter(it=>it.o===myTag()).length>=pzCap()){ttoast(`광장에는 한 사람이 ${pzCap()}개까지 놓을 수 있어요`);return;}
 if(!(SAVE.deco.stock[k]>0)){ttoast('창고에 없는 장식이에요');ed.carry=null;edRefresh();return;}
 ed.pz.busy=true;ed.pending={k,i,j,f};setHint();
 const L=pzL(),x=i-L,y=j-L,id=SAVE.id,res=await pzReq({type:'plaza_put',gr:ed.gr,cl:ed.cl,x,y,k,s:DECO[k].s,f,id,n:SAVE.name,sig:hash(SALT+'pz'+lab+'|'+x+'|'+y+'|'+k+'|'+id)});
 if(ED!==ed)return;ed.pz.busy=false;ed.pending=null;ed.pz.last=Date.now();
 if(res&&res.pz)pzSetInfo(ed,res.pz);
 if(res&&Array.isArray(res.items))setPlaza(res.items);
 if(res&&res.ok){SFX.pop();ttoast(`${nm}${josa(nm,'을','를')} 광장에 놓았어요!`);if(!(SAVE.deco.stock[k]>0))ed.carry=null;}
 else if(res){SFX.miss();ttoast({taken:'다른 친구가 먼저 그 자리에 놓았어요',path:'가운데 길에는 놓을 수 없어요',max:`광장에는 한 사람이 ${pzCap()}개까지 놓을 수 있어요`,range:'광장 밖이에요',deleted:'선생님이 이 계정을 지웠어요'}[res.error]||'놓지 못했어요. 잠시 뒤에 다시 해 보세요');if(res.error==='deleted')syncPush();}
 else{ttoast('연결이 불안정해요. 광장을 다시 불러올게요');plazaPull(true);}
 edRefresh();}
async function plazaTake(o){const ed=ED;if(ed.pz.busy)return;const lab=plazaLabel(ed.gr,ed.cl),id=SAVE.id,nm=DECO[o.k].name;ed.pz.busy=true;setHint();
 const res=await pzReq({type:'plaza_take',gr:ed.gr,cl:ed.cl,x:o.x,y:o.y,id,sig:hash(SALT+'pzt'+lab+'|'+o.x+'|'+o.y+'|'+id)});
 if(ED!==ed)return;ed.pz.busy=false;ed.pz.last=Date.now();
 if(res&&res.pz)pzSetInfo(ed,res.pz);
 if(res&&Array.isArray(res.items)){ed.sel=null;setPlaza(res.items);}
 if(res&&res.ok){SFX.pop();ttoast(`${nm}${josa(nm,'을','를')} 내 창고로 가져왔어요`);}
 else if(res)ttoast(res.error==='notmine'?'친구가 놓은 장식은 가져올 수 없어요':'이미 없어진 장식이에요');
 else{ttoast('연결이 불안정해요. 광장을 다시 불러올게요');plazaPull(true);}
 edRefresh();}
async function plazaAdmin(o){const ed=ED;if(ed.pz.busy)return;if(!TPIN){ttoast('선생님 모드에서 광장을 다시 열어 주세요');return;}ed.pz.busy=true;setHint();
 const res=await pzReq({type:'plaza_admin',gr:ed.gr,cl:ed.cl,x:o.x,y:o.y,pin:TPIN});
 if(ED!==ed)return;ed.pz.busy=false;ed.pz.last=Date.now();
 if(res&&res.pz)pzSetInfo(ed,res.pz);
 if(res&&Array.isArray(res.items)){ed.sel=null;setPlaza(res.items);}
 ttoast(res&&res.ok?'치웠어요':res&&res.error==='pin'?'비밀번호가 맞지 않아요. Apps Script 코드의 TEACHER_PIN_HASH를 확인해 주세요':'연결하지 못했어요. 잠시 뒤에 다시 해 보세요');
 edRefresh();}

/* ---------- 우리 반 광장 모금함: 반 친구들과 코인을 모아 광장을 넓혀요 ---------- */
// 코인은 시트에 들어간 것이 확인된 뒤에만 빠져요. 답을 못 받으면 같은 확인 번호(r)로 다시 확인해요(두 번 들어가지 않아요).
let GV=null;const GIVE_CHIPS=[50,100,300,500,1000];
const myGive=()=>(SAVE&&SAVE.give&&SAVE.give[plazaLabel(SAVE.gr,SAVE.cl)])||{};
function giveLeft(){const p=ED&&ED.pzI,g=myGive();if(!p)return 0;return Math.max(0,(p.day||1000)-(+g.day===kstDay()?(+g.d||0):0));}
function giveMy(lab,my){if(!my||typeof my!=='object')return;SAVE.give=SAVE.give||{};SAVE.give[lab]={day:+my.day||0,d:+my.d||0,lv:+my.lv||0,l:+my.l||0,all:+my.all||0};}
function openGive(){if(!ED||ED.mode!=='plaza'||ED.visit||ED.admin||!SAVE)return;if(!ED.pzI){ttoast('모금함은 선생님이 Apps Script를 새 버전으로 올리면 쓸 수 있어요');return;}
 GV={amt:0,arm:false,busy:false,msg:'',ok:false};renderGive();show('pGive',true);if(SAVE.pzTry)giveCheck();}
function renderGive(){if(!GV||!ED||!ED.pzI||!SAVE)return;const p=ED.pzI,n=PLAZA_N+2*p.lv,full=p.lv>=p.max,g=myGive(),left=giveLeft(),mx=Math.min(SAVE.coins,left),a=GV.amt,dis=GV.busy?'disabled':'';
 const chips=GIVE_CHIPS.map(v=>`<button class="chip ${a===v?'on':''}" data-act="give-amt" data-v="${v}" ${v>mx||GV.busy?'disabled':''}>${v.toLocaleString()}</button>`).join('');
 const myL=+g.lv===p.lv?(+g.l||0):0,names=p.d?(p.d.length?p.d.map(esc).join(' · '):'아직 없어요. 첫 번째로 보태 볼까요?'):'불러오는 중…';
 $('pGive').innerHTML=`<div class="panel wide give"><h2>🐷 우리 반 광장 모금함</h2>
 <p class="sub">모금함이 다 차면 광장이 사방으로 한 줄씩 넓어지고, 한 사람이 장식을 2개 더 놓을 수 있어요.</p>
 <div class="monpanel">${full?`<b>🎉 가장 넓은 광장이에요! (${n}×${n})</b><span>모금함은 닫혔어요. 함께 모아 준 친구들 고마워요!</span>`:`<b>지금 ${n}×${n} → 다음 ${n+2}×${n+2}</b><div class="mbar"><i style="width:${Math.max(2,Math.min(100,Math.round(p.f/Math.max(1,p.goal)*100)))}%"></i></div><span>${p.f.toLocaleString()} / ${p.goal.toLocaleString()}코인 · ${Math.max(0,p.goal-p.f).toLocaleString()}코인 남았어요</span>`}</div>
 ${full?'':`<div class="givebar">내 코인 <b>${SAVE.coins.toLocaleString()}</b> · 오늘 더 보낼 수 있는 코인 <b>${left.toLocaleString()}</b> <small>(한 사람 하루 ${(p.day||1000).toLocaleString()}코인까지)</small></div>
 <div class="tabs gchips">${chips}<label class="gin">직접 <input id="gAmt" type="number" min="1" max="${mx}" inputmode="numeric" value="${a&&!GIVE_CHIPS.includes(a)?a:''}" ${dis}></label></div>
 <p class="msg ${GV.ok?'ok':''}" id="gMsg">${GV.arm?'보낸 코인은 돌려받을 수 없어요. 정말 보낼까요?':esc(GV.msg||'')}</p>
 <div class="btnrow">${GV.arm?`<button class="gbtn inline" data-act="give-ok">💛 네, ${a.toLocaleString()}코인 보낼게요</button><button class="sbtn inline" data-act="give-no">아니요</button>`:`<button class="gbtn inline" id="gGo" data-act="give-go" ${a>0&&a<=mx&&!GV.busy?'':'disabled'}>💛 ${a>0?a.toLocaleString()+'코인 ':''}보내기</button>`}</div>`}
 <h3>이번 단계 함께한 친구 ${p.d?`(${p.d.length}명${p.m?` / ${p.m}명`:''})`:''}</h3><div class="gnames">${names}</div>
 <div class="gfoot"><p class="note">내가 보탠 코인: 이번 단계 ${myL.toLocaleString()} · 지금까지 ${(+g.all||0).toLocaleString()} (금액은 나만 보여요)</p><button class="gbtn sm" data-act="close" data-p="pGive">닫기</button></div></div>`;}
function giveSync(){if(!GV)return;const b=$('gGo');if(!b)return;const mx=Math.min(SAVE.coins,giveLeft()),a=GV.amt;b.disabled=!(a>0&&a<=mx&&!GV.busy);b.textContent=`💛 ${a>0?a.toLocaleString()+'코인 ':''}보내기`;
 $('pGive').querySelectorAll('[data-act=give-amt]').forEach(el=>el.classList.toggle('on',+el.dataset.v===a));const m=$('gMsg');if(m){m.className='msg';m.textContent=a>SAVE.coins?'코인이 부족해요':a>giveLeft()?`오늘은 ${giveLeft().toLocaleString()}코인까지 보낼 수 있어요`:'';}}
async function giveSend(){const ed=ED;if(!ed||!GV||GV.busy||!ed.pzI||!SAVE)return;const a=GV.amt,lab=plazaLabel(ed.gr,ed.cl);if(!(a>0)||a>SAVE.coins||a>giveLeft())return;
 GV.busy=true;GV.arm=false;GV.ok=false;GV.msg='보내는 중…';renderGive();
 const t=SAVE.pzTry,r=(t&&t.lab===lab&&t.a===a&&Date.now()-t.at<6*3600000)?t.r:(rid()+rid()).replace(/[^a-z0-9]/g,'');SAVE.pzTry={r,a,lab,at:Date.now()};saveGame();
 const res=await pzReq({type:'plaza_give',gr:ed.gr,cl:ed.cl,a,r,id:SAVE.id,sig:hash(SALT+'pzg'+lab+'|'+a+'|'+r+'|'+SAVE.id)});
 if(!SAVE)return;if(GV)GV.busy=false;
 if(res&&res.ok)giveDone(ed,res,a);
 else if(res){delete SAVE.pzTry;if(res.my)giveMy(lab,res.my);saveGame();if(res.pz&&ED===ed)pzSetInfo(ed,res.pz);
  if(GV)GV.msg={daily:'오늘 보낼 수 있는 코인을 다 보냈어요. 내일 또 보태 주세요!',max:'광장이 가장 넓어져서 모금함이 닫혔어요',deleted:'선생님이 이 계정을 지웠어요',class:'우리 반 광장에만 보낼 수 있어요',none:'시트에서 내 기록을 찾지 못했어요. 게임을 한 판 하고 다시 해 보세요',bad:'선생님이 Apps Script를 새 버전으로 올리면 보낼 수 있어요',busy:'시트가 바빠요. 잠시 뒤에 다시 보내 주세요'}[res.error]||'보내지 못했어요. 잠시 뒤에 다시 해 보세요';
  if(res.error==='deleted')syncPush();}
 else if(GV)GV.msg='연결이 불안정해요. 다음에 들어갔는지 다시 확인할게요. (코인은 들어간 게 확인될 때만 빠져요)';
 if(ED===ed){renderGive();renderEdBar();}}
function giveDone(ed,res,want){const got=Math.max(0,+res.a||0),lab=plazaLabel(SAVE.gr,SAVE.cl);SAVE.coins=Math.max(0,SAVE.coins-got);clog('pz','',1,-got);delete SAVE.pzTry;if(res.my)giveMy(lab,res.my);saveGame();bagSync();SFX.coin();
 if(ed&&ED===ed&&res.pz)pzSetInfo(ed,res.pz);
 if(GV){GV.ok=true;GV.amt=0;GV.msg=res.dup?`지난번에 보낸 ${got.toLocaleString()}코인이 모금함에 들어가 있었어요. 고마워요!`:`💛 ${got.toLocaleString()}코인을 보탰어요! 고마워요${want&&got<want?` (보낼 수 있는 만큼만 보냈어요)`:''}`;}
 if(ED){renderEdBar();renderMonBar();}}
let giveBusy=false;
async function giveCheck(){const t=SAVE&&SAVE.pzTry;if(!t||!SYNC||giveBusy)return;if(Date.now()-t.at>86400000||t.lab!==plazaLabel(SAVE.gr,SAVE.cl)){delete SAVE.pzTry;saveGame();return;}
 giveBusy=true;const res=await pzReq({type:'plaza_give',chk:1,gr:SAVE.gr,cl:SAVE.cl,a:t.a,r:t.r,id:SAVE.id,sig:hash(SALT+'pzg'+t.lab+'|'+t.a+'|'+t.r+'|'+SAVE.id)});giveBusy=false;
 if(!res||!SAVE||!SAVE.pzTry||SAVE.pzTry.r!==t.r)return;
 if(res.ok&&res.dup){giveDone(ED&&ED.mode==='plaza'&&!ED.visit&&!ED.admin?ED:null,res,0);ttoast(`💛 지난번에 보낸 ${(+res.a||0).toLocaleString()}코인이 모금함에 들어갔어요`);}
 else{delete SAVE.pzTry;saveGame();}
 if(GV&&!$('pGive').classList.contains('hidden'))renderGive();}

/* ---------- 랭킹 ---------- */
function myEntry(){const g={};let cw=0;for(const gm of READY){const s=SAVE.games[gm.id];g[gm.id]={r:s.bestRound,w:s.bestWords,t:s.bestTasu};cw+=+s.words||0;}return{i:SAVE.id,gr:SAVE.gr||0,cl:SAVE.cl||0,n:SAVE.name,b:SAVE.no,lv:charLevel(),sk:SAVE.skin||'base',cw,ver:APP_VER,g,ts:Date.now()};}
const validEntry=e=>e&&typeof e.i==='string'&&typeof e.n==='string'&&e.g&&typeof e.g==='object';
// 시트에서 온 기록은 학생ID 대신 암호 꼬리표(8자리)를 써요. 코드로 모은 기록도 같은 꼬리표로 바꿔서 겹치지 않게 해요.
const tagOf=id=>/^[0-9a-f]{8}$/.test(String(id))?String(id):hash(SALT+'tag'+id);
const clsKey=e=>`${+e.gr||0}-${+e.cl||0}`;
const clsName=k=>{const[g,c]=k.split('-');return +g&&+c?`${g}학년 ${c}반`:'반 모름';};

/* ---------- 반 랭킹 자동 연동 (구글 시트 + Apps Script) ---------- */
let liveMem=null,pushing=false,pushAgain=false,pushRetry=0;
const tmo=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),ms))]);
const liveCached=()=>liveMem||store.get('taja2_live',null);
function mergeLists(...ls){const m=new Map();for(const L of ls)for(const e0 of(L||[])){if(!validEntry(e0))continue;const e=Object.assign({},e0,{i:tagOf(e0.i)}),o=m.get(e.i);if(!o||(+e.ts||0)>(+o.ts||0))m.set(e.i,e);}return[...m.values()];}
function ago(t){if(!t)return '';const s=(Date.now()-t)/1000;if(s<60)return '방금';if(s<3600)return `${Math.floor(s/60)}분 전`;const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;}
// pin: [이 크롬북 관리]에서 선생님이 고친 정보를 보낼 때만 (시트에 '선생님이 정한 이름·번호'로 남아요)
let pushPin='';
async function syncPush(pin){if(typeof pin==='string'&&pin)pushPin=pin;if(!SYNC||!SAVE)return false;if(pushing){pushAgain=true;return false;}pushing=true;
 const ent=myEntry(),vg=vgPack();ent.bag=bagSnap();if(Array.isArray(SAVE.adjAck)&&SAVE.adjAck.length)ent.aa=SAVE.adjAck.slice(0,20);if(hash(vg)!==SAVE.vgH||Date.now()-(+SAVE.vgAt||0)>21600000)ent.vg=vg; // 친구 마을 구경용: 마을이 바뀌었거나 6시간이 지났을 때만
 const data=JSON.stringify(ent),req={type:'record',data,sig:hash(SALT+'sync'+data)},usedPin=pushPin;if(usedPin)req.pin=usedPin;
 const body=JSON.stringify(req);let ok=false,res=null,j=null;
 try{res=await tmo(fetch(SYNC_URL,{method:'POST',body}),20000);}catch(e){res=null;}
 if(res){try{j=await res.json();ok=!!(j&&j.ok);}catch(e){ok=false;}}
 else{try{await tmo(fetch(SYNC_URL,{method:'POST',body,mode:'no-cors'}),20000);ok=true;}catch(e){}}
 if(ok&&usedPin===pushPin)pushPin='';
 pushing=false;
 if(j)syncReply(j);
 if(!SAVE)return false;
 SAVE.syncPending=!ok&&!(j&&j.error==='deleted');if(ok){SAVE.syncAt=Date.now();if(ent.vg&&j&&j.cls){SAVE.vgH=hash(ent.vg);SAVE.vgAt=Date.now();}}saveGame();
 if(pushAgain){pushAgain=false;syncPush();}
 else if(!ok&&pushRetry<3){pushRetry++;setTimeout(syncPush,15000+Math.random()*20000);}
 else if(ok)pushRetry=0;
 return ok;}
async function syncPull(){if(!SYNC)return null;try{const r=await tmo(fetch(SYNC_URL+(SYNC_URL.includes('?')?'&':'?')+'action=list&_='+Date.now()),20000);const j=await r.json();
 if(j&&j.ok&&Array.isArray(j.list)){liveMem={t:Date.now(),list:j.list.filter(validEntry)};store.set('taja2_live',liveMem);return liveMem;}}catch(e){}return null;}
// 시트의 답: 선생님이 바꾼 이름·번호는 이 크롬북에도 바꾸고, 선생님이 지운 계정이면 이 크롬북을 처음 상태로 돌려요
function syncReply(j){if(!SAVE||!j)return;
 if(j.error==='deleted'){if(R&&!R.over)return;accountDeleted();return;}
 if(!j.ok)return;
 adjGot(j);
 const n=typeof j.n==='string'?j.n.replace(/\s+/g,' ').trim().slice(0,10):'',b=+j.b||0,ch=[];
 if([...n].length>=2&&n!==SAVE.name){SAVE.name=n;ch.push('이름');}
 if(b>=1&&b<=99&&b!==SAVE.no){SAVE.no=b;ch.push('번호');}
 if(ch.length){saveGame();renderProfile();ttoast(`선생님이 ${ch.join('·')}를 바꿨어요: ${SAVE.name} · ${SAVE.no}번`);}
 if(j.mon&&SAVE.gr&&SAVE.cl)monUpdate(plazaLabel(SAVE.gr,SAVE.cl),j.mon);
 if(j.cls&&SAVE.gr&&SAVE.cl)clsGot(j.cls);
 if(j.pz&&SAVE.gr&&SAVE.cl){const lab=plazaLabel(SAVE.gr,SAVE.cl),lv=+j.pz.lv|0;SAVE.pzHome=SAVE.pzHome||{};const seen=SAVE.pzHome[lab];
  if(seen!=null&&lv>seen&&scr==='home'){const n=PLAZA_N+2*lv;setTimeout(()=>ttoast(`🎉 우리 반 광장이 ${n}×${n}으로 넓어졌어요! 광장에 가 보세요`),1200);}
  if(seen!==lv){SAVE.pzHome[lab]=lv;saveGame();}}}
// 우리 반 기념비 소식: 처음이면 기념 장식을 주고, 단계가 오르면 기념 장식이 새것으로 바뀌어요(하나만 있어요)
function monUpdate(lab,m){if(!m||typeof m!=='object')return;MON[lab]={w:+m.w||0,s:+m.s||0,d:+m.d||0,m:+m.m||0};
 if(!SAVE||!SAVE.gr||!SAVE.cl||lab!==plazaLabel(SAVE.gr,SAVE.cl))return;const lv=monStage(MON[lab]);
 if(!SAVE.cmGot){SAVE.cmGot=1;SAVE.cm=lv;SAVE.deco.stock.cmemo=(SAVE.deco.stock.cmemo||0)+1;saveGame();SFX.level();ttoast('⭐ 우리 반 기념 장식을 받았어요! 내 마을 꾸미기에서 꺼내 놓아 보세요');if(ED&&ED.mode==='deco')renderPalette();return;}
 if(lv!==SAVE.cm){const upLv=lv>SAVE.cm;SAVE.cm=lv;saveGame();if(upLv){SFX.level();ttoast(`🎉 우리 반 기념비가 ${lv}단계가 됐어요! 내 기념 장식도 바뀌었어요`);}if(ED&&ED.mode==='deco')renderPalette();}}
function accountDeleted(){try{localStorage.removeItem(SKEY);localStorage.removeItem('taja2_classview');localStorage.removeItem('taja2_live');localStorage.removeItem('taja2_cls');}catch(e){}CLS=null;
 liveMem=null;SAVE=null;PANELS.forEach(p=>show(p,false));goHome();

function entryVal(e,game,m){if(game==='total'){if(m==='r')return READY.reduce((a,gm)=>a+(+((e.g[gm.id]||{}).r)||0),0);return READY.reduce((a,gm)=>a+(+((e.g[gm.id]||{}).t)||0),0);}const v=e.g[game]||{};return m==='r'?(+v.r||0):(+v.t||0);}
function rankTabs(pre,game,m){return `<div class="tabs">${READY.map(g=>`<button class="chip ${game===g.id?'on':''}" data-act="${pre}-game" data-g="${g.id}">${esc(g.short||g.name)}</button>`).join('')}<button class="chip ${game==='total'?'on':''}" data-act="${pre}-game" data-g="total">합산</button>
 <span style="width:18px"></span><button class="chip sm2 ${m==='r'?'on':''}" data-act="${pre}-metric" data-m="r">최고 라운드</button><button class="chip sm2 ${m==='t'?'on':''}" data-act="${pre}-metric" data-m="t">분당 타수</button></div>`;}
function rankHTML(list,game,m,meId,showCls,vis){const rows=list.map(e=>({e,v:entryVal(e,game,m),w:game==='total'?0:(+((e.g[game]||{}).w)||0)})).sort((a,b)=>b.v-a.v||b.w-a.w||(+a.e.b||0)-(+b.e.b||0));
 if(!rows.length)return '<p class="empty">아직 기록이 없어요.</p>';
 const head=m==='r'?(game==='total'?'라운드 합계':'최고 라운드'):(game==='total'?'분당 타수 합계':'분당 타수'),unit=m==='r'?'라운드':'타';let rank=0,prev=null;
 return `<table class="rank"><thead><tr><th>순위</th>${showCls?'<th>반</th>':''}<th>번호</th><th>이름</th><th>${head}</th><th>별지기</th></tr></thead><tbody>${rows.map((r,i)=>{if(!prev||r.v!==prev.v||r.w!==prev.w)rank=i+1;prev=r;const md=rank<=3&&r.v>0?`<span class="medal m${rank}">${rank}</span>`:rank;
  return `<tr class="${meId&&r.e.i===meId?'me':''}"><td>${md}</td>${showCls?`<td>${+r.e.gr&&+r.e.cl?`${+r.e.gr}-${+r.e.cl}`:'-'}</td>`:''}<td>${esc(r.e.b||'-')}</td><td>${esc(r.e.n)}</td><td>${r.v?r.v+unit:'-'}</td><td>${vis?`<button class="skbtn" data-act="vg-open" data-t="${esc(r.e.i)}" title="마을 구경"><img class="skf" src="${skinFace(r.e.sk)}" alt="">Lv.${esc(r.e.lv||1)} 🏡</button>`:`<img class="skf" src="${skinFace(r.e.sk)}" alt="">Lv.${esc(r.e.lv||1)}`}</td></tr>`;}).join('')}</tbody></table>`;}

 const vis=SYNC&&!!hasCls;
 $('pRank').innerHTML=`<div class="panel wide"><h2>🏆 ${hasCls?plazaLabel(SAVE.gr,SAVE.cl):'우리 반'} 랭킹</h2>${rkViewTabs()}${rankTabs('rk',rkG,rkM)}<div class="rankbox">${rankHTML(list,rkG,rkM,me,false,vis)}</div>
 <p class="note">${note}${vis?'<br>🏡 별지기를 누르면 그 친구의 마을을 구경할 수 있어요.':''}</p><div class="btnrow">${SYNC?'<button class="sbtn inline" data-act="rk-refresh">새로고침</button>':''}<button class="gbtn inline" data-act="close" data-p="pRank">닫기</button></div></div>`;}

/* ---------- 반별 랭킹: 이번 주(월요일부터), 같은 학년 반끼리, 반 점수 = 반 별가루 ÷ 반 친구 수 ---------- */
// 한국 시간으로 이번 주 월요일을 20261102처럼 (Apps Script의 kstWeek_와 같아요)
function kstDay(){const d=new Date(Date.now()+9*3600000);return d.getUTCFullYear()*10000+(d.getUTCMonth()+1)*100+d.getUTCDate();}
const isNew=k=>NEW_KEYS.has(k)&&kstDay()<=NEW_UNTIL;
function kstWeek(back){const d=new Date(Date.now()+9*3600000),dow=(d.getUTCDay()+6)%7,m=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-dow-7*(back||0)));return m.getUTCFullYear()*10000+(m.getUTCMonth()+1)*100+m.getUTCDate();}
const wkLabel=wk=>`${Math.floor(wk/100)%100}월 ${wk%100}일(월)`;
let CLS=store.get('taja2_cls',null),clsLoading=false,clsErr='';
function clsParse(d){if(!d||!Array.isArray(d.list)||!(+d.wk>0))return null;
 return{t:Date.now(),wk:+d.wk,min:+d.min>0?+d.min:5,day:+d.day>0?+d.day:200,list:d.list.filter(c=>c&&+c.gr>0&&+c.cl>0).map(c=>({gr:+c.gr,cl:+c.cl,m:+c.m||0,w:+c.w||0,p:+c.p||0,lw:+c.lw||0}))};}
// 반 목록 받기 (gr이 0이면 모든 학년: 선생님 모드). 예전 Apps Script면 {old:true}
async function clsFetch(gr){if(!SYNC)return null;try{const r=await tmo(fetch(`${SYNC_URL}${SYNC_URL.includes('?')?'&':'?'}action=classes&gr=${gr||0}&_=${Date.now()}`),20000);const j=await r.json();const d=j&&j.ok&&clsParse(j);if(d)return d;if(j&&j.ok)return{old:true};}catch(e){}return null;}
function clsKeep(d){if(!d||!SAVE)return;CLS=Object.assign(d,{gr:SAVE.gr});store.set('taja2_cls',CLS);clsErr='';renderBadge();}
async function clsPull(){if(!SYNC||!SAVE||!SAVE.gr||!SAVE.cl)return null;clsLoading=true;const d=await clsFetch(SAVE.gr);clsLoading=false;
 if(d&&!d.old)clsKeep(d);else clsErr=d?'old':'net';return d;}
// 게임 기록을 보낸 답에 같은 학년 반들의 이번 주 기록이 함께 와요
function clsGot(x){const d=clsParse(x);if(!d)return;clsKeep(d);if(rankOpen()&&rkV==='cls')renderRank();}
// 점수가 같으면 같은 등수. 이번 주에 아직 0점인 반은 등수 없이 '-'. 학생이 min명보다 적은 반은 순위 밖
function clsRank(list,min){const L=list.map(c=>Object.assign({},c,{s:c.m?Math.round(c.w/c.m):0,ls:c.m?Math.round(c.lw/c.m):0,ok:c.m>=min}));
 const rows=L.filter(c=>c.ok).sort((a,b)=>b.s-a.s||a.cl-b.cl);let rank=0,prev=-1;rows.forEach((c,i)=>{if(c.s!==prev)rank=i+1;prev=c.s;c.rank=c.s>0?rank:0;});
 const lw=L.filter(c=>c.ok&&c.ls>0).sort((a,b)=>b.ls-a.ls);
 return{rows,out:L.filter(c=>!c.ok).sort((a,b)=>a.cl-b.cl),lastTop:lw.filter(c=>c.ls===lw[0].ls)};}
function myCls(){if(!SAVE||!SAVE.gr||!SAVE.cl||!CLS||CLS.wk!==kstWeek())return null;const list=CLS.list.filter(c=>c.gr===SAVE.gr);if(!list.length)return null;const r=clsRank(list,CLS.min);return{r,me:r.rows.find(c=>c.cl===SAVE.cl)||null};}
// 홈 화면 🏆: 이번 주 우리 반이 1등이면 랭킹 버튼에 붙어요 (누르면 반별 랭킹)
function renderBadge(){const el=$('rkBadge');if(!el)return;const x=SYNC?myCls():null,top=!!(x&&x.me&&x.me.rank===1);el.classList.toggle('hidden',!top);
 if(top)el.textContent=x.r.rows.filter(c=>c.rank===1).length>1?'🏆 공동 1등!':'🏆 우리 반 1등!';}
function clsMsg(R,list,myCl,min){const me=R.rows.find(c=>c.cl===myCl),mine=list.find(c=>c.cl===myCl),top=R.rows[0];
 if(!me)return mine?`우리 반은 아직 ${mine.m}명이라 순위에 들어가지 않아요. ${min}명이 되면 들어가요.`:'우리 반 기록이 아직 없어요. 게임을 한 판 하면 들어가요!';
 if(!top||top.s<=0)return '아직 이번 주 기록이 없어요. 먼저 별가루를 모아 1등을 차지해 봐요! 🚀';
 if(me.rank===1){const next=R.rows.find(c=>c.rank>1);return R.rows.filter(c=>c.rank===1).length>1?'🎉 우리 반이 <b>공동 1등</b>이에요! 조금만 더 하면 혼자 1등!':`🎉 우리 반이 <b>1등</b>이에요!${next?` 2등 반과 <b>${me.s-next.s}점</b> 차이예요.`:''}`;}
 const gap=top.s-me.s,above=R.rows.filter(c=>c.s>me.s).pop();
 return `1등 반까지 <b>${gap}점</b>!${above&&above.s<top.s?` 바로 위 ${above.rank}등 반까지 <b>${above.s-me.s}점</b>.`:''}<br>반 친구 모두가 낱말을 ${gap+1}개씩 더 맞히면 1등이 될 수 있어요!`;}
function clsBoard(x,gr,myCl){const list=x.list.filter(c=>c.gr===gr),R=clsRank(list,x.min),max=Math.max(1,...R.rows.map(c=>c.s));
 const bar=c=>`<div class="cbar ${c.cl===myCl?'me':''}"><span>${c.rank?(c.rank<=3?`<span class="medal m${c.rank}">${c.rank}</span>`:c.rank):'-'}</span><b class="cn">${c.cl}반${c.cl===myCl?' ⭐':''}</b><div class="ctrack"><i style="width:${c.s?Math.max(3,Math.round(c.s/max*100)):0}%"></i></div><b class="cs">${c.s.toLocaleString()}점</b><small>참여 ${c.p}/${c.m}명</small></div>`;
 return `<div class="clshead"><span>📅 ${wkLabel(x.wk)}부터 · 월요일마다 새로 시작해요</span>${R.lastTop.length?`<span class="lasttop">지난주 1등: ${R.lastTop.map(c=>c.cl+'반').join('·')} 🏆</span>`:''}</div>`
  +(R.rows.length?`<div class="cbars">${R.rows.map(bar).join('')}</div>`:'<p class="empty">아직 순위에 들어간 반이 없어요.</p>')
  +(R.out.length?`<p class="cout">순위 밖 (${x.min}명보다 적은 반): ${R.out.map(c=>`${c.cl}반 ${c.m}명`).join(', ')}</p>`:'')
  +(myCl?`<p class="cmsg">${clsMsg(R,list,myCl,x.min)}</p>`:'');}
function rkViewTabs(){return SYNC?`<div class="rkview"><button class="chip ${rkV==='me'?'on':''}" data-act="rk-view" data-v="me">👫 우리 반 친구</button><button class="chip ${rkV==='cls'?'on':''}" data-act="rk-view" data-v="cls">🏫 반별 랭킹 (이번 주)</button></div>`:'';}
function renderClsRank(){const hasCls=SAVE.gr&&SAVE.cl,x=hasCls&&CLS&&CLS.list.some(c=>c.gr===SAVE.gr)?CLS:null;
 const body=!hasCls?'<p class="empty">학년과 반을 먼저 알려 주세요.</p>':x?clsBoard(x,SAVE.gr,SAVE.cl)
  :`<p class="empty">${clsLoading?'반별 랭킹을 불러오는 중이에요…':clsErr==='old'?'반별 랭킹은 선생님이 Apps Script를 새 버전으로 올리면 볼 수 있어요.':clsErr?'반별 랭킹에 연결하지 못했어요. 잠시 뒤에 [새로고침]을 눌러 주세요.':'아직 반별 기록이 없어요.'}</p>`;
 const st=x&&clsLoading?'새로 불러오는 중…':x&&clsErr==='net'?`지금은 연결하지 못했어요. ${ago(x.t)}에 불러온 기록이에요.`:'';
 $('pRank').innerHTML=`<div class="panel wide"><h2>🏆 ${hasCls?`${SAVE.gr}학년 `:''}반별 랭킹</h2>${rkViewTabs()}${body}

 <div class="btnrow"><button class="sbtn inline" data-act="rk-refresh">새로고침</button><button class="gbtn inline" data-act="close" data-p="pRank">닫기</button></div></div>`;}

/* ---------- 친구 마을 구경 (우리 반 랭킹에서 별지기를 눌러요) ---------- */
// 시트에 올리는 내 마을 모습: '1|섬 크기|땅(칸마다 한 글자, 잔디 0)|장식,i,j,뒤집기;…'
function vgPack(){const d=SAVE.deco,n=d.n;let g='';for(let i=0;i<n;i++)for(let j=0;j<n;j++){const x=GT_IDS.indexOf(d.ground[i+','+j]);g+=(x>0?x:0).toString(36);}
 return `1|${n}|${g.replace(/0+$/,'')}|${d.objs.filter(o=>DECO[o.k]).map(o=>`${o.k},${o.i},${o.j},${o.f?1:0}`).join(';')}`;}
function vgParse(s){const p=String(s||'').split('|');if(p.length!==4||p[0]!=='1')return null;const n=+p[1];if(!LAND.includes(n))return null;
 const ground={};for(let q=0;q<p[2].length&&q<n*n;q++){const g=GT_IDS[parseInt(p[2][q],36)];if(g&&g!=='grass')ground[Math.floor(q/n)+','+(q%n)]=g;}
 const objs=[];for(const t of p[3].split(';')){const[k,i,j,f]=t.split(',');if(!DECO[k])continue;const o={k,i:+i|0,j:+j|0,f:+f?1:0};if(o.i>=0&&o.j>=0&&o.i+DECO[k].s<=n&&o.j+DECO[k].s<=n)objs.push(o);}
 return{n,ground,objs};}
let vgBusy=false;

 if(t===myTag()){const d=SAVE.deco;openEditor('friend',{fv:{me:true,name:SAVE.name,sk:SAVE.skin,n:d.n,ground:Object.assign({},d.ground),objs:d.objs.map(o=>Object.assign({},o))}});return;}
 if(!SYNC||!SAVE.gr||!SAVE.cl)return;vgBusy=true;ttoast('친구 마을을 불러오는 중이에요…');let j=null;
 try{const r=await tmo(fetch(`${SYNC_URL}${SYNC_URL.includes('?')?'&':'?'}action=village&t=${encodeURIComponent(t)}&gr=${SAVE.gr}&cl=${SAVE.cl}&_=${Date.now()}`),20000);j=await r.json();}catch(e){}
 vgBusy=false;if(!rankOpen()||scr!=='home')return; // 기다리는 동안 랭킹을 닫았으면 그대로 둬요

const clsSort=(a,b)=>{const[g1,c1]=a.split('-').map(Number),[g2,c2]=b.split('-').map(Number);return(g1||99)-(g2||99)||(c1||99)-(c2||99);};
// 같은 반에 번호나 이름이 겹치는 학생 (한 학생이 크롬북 두 대에 등록한 경우를 찾기 쉽게)
function dupInfo(L){const by={},out={};for(const e of L){const k=clsKey(e),nm=String(e.n||'').trim();
  if(+e.b>0)(by[k+'|b|'+e.b]=by[k+'|b|'+e.b]||[]).push(e.i);
  if(nm)(by[k+'|n|'+nm]=by[k+'|n|'+nm]||[]).push(e.i);}
 for(const key in by)if(by[key].length>1)for(const i of by[key])(out[i]=out[i]||[]).push(key.includes('|b|')?'같은 번호':'같은 이름');

function tBagLoad(key){const[gr,cl]=key.split('-').map(Number),prev=tBag&&tBag.key===key?tBag:null;

function tBagHTML(msg){const live=tLive&&tLive.full?tLive:null,ALL=live?live.list:[],keys=[...new Set(ALL.map(clsKey))].filter(k=>!/^0-|-0$/.test(k)).sort(clsSort);

 if(!tBag||tBag.key!==tCls){const k=tCls;tBag={key:k,loading:true,list:[],adj:[],err:''};setTimeout(()=>tBagLoad(k),0);}

 const head=`<p class="sub" style="margin:0 0 4px">${tBag.loading?'불러오는 중…':tBag.t?`${ago(tBag.t)} 불러옴`:''} &nbsp;<button class="sbtn sm" style="display:inline-block;width:auto" data-act="tb-refresh">새로고침</button></p>`;

function tBagTable(){const L=tBag.list.slice().sort((a,b)=>(+a.b||99)-(+b.b||99)||String(a.n).localeCompare(String(b.n),'ko'));
 if(!L.length)return `<p class="empty">${tBag.loading?'불러오는 중이에요':'이 반에는 아직 학생이 없어요'}</p>`;

  <p class="note">학생 크롬북이 게임을 열거나, 한 판을 마치거나, 상점에서 사고팔 때 시트에 올라와요.<br>선생님이 고친 것은 학생에게 알리지 않고, 그 크롬북이 다음에 연결할 때 적용돼요.</p>`;}
function tBagDetail(e){tBagArm='';const it=e.it||{},d=e.d||{},dis=tBag.busy?'disabled':'';

 const up=Object.keys(UPS).map(k=>`${UPS[k].name} Lv.${+(e.up||{})[k]||0}`).join(' · '),sk=(e.sk||[]).map(k=>SKINS[k]?SKINS[k].name:k).join(', ');
 const adj=tBag.adj.filter(a=>a.t===e.t).sort((x,y)=>(y.ct||0)-(x.ct||0)).slice(0,12);

 const adjH=adj.length?`<table class="rank mg bag adj"><tr><th>만든 때</th><th style="text-align:left">고친 것</th><th>상태</th></tr>${adj.map(a=>`<tr><td>${tfmt(a.ct)}</td><td style="text-align:left">${esc(a.s||'')}${a.m?` <span class="hint">· ${esc(a.m)}</span>`:''}</td><td class="mgbtns">${a.st==='대기'?`적용 대기 <button class="sbtn" data-act="tb-cancel" data-r="${esc(a.r)}" ${dis}>취소</button>`:a.st==='적용'?`적용됨 ${tfmt(a.at)}${resT(a.res)}`:'취소함'}</td></tr>`).join('')}</table>`:'<p class="empty" style="margin:4px 0">아직 고친 적이 없어요</p>';

 return `<div class="bagdet"><div class="row" style="justify-content:space-between"><b style="font-size:28px">${esc(clsName(tBag.key))} ${+e.b||'-'}번 ${esc(e.n)}</b><button class="sbtn" data-act="tb-back">← 반 목록으로</button></div>

function tBagForm(e){const a={c:0,it:{},d:{},rf:0},sum=[],v=id=>($(id)||{}).value;
 const c=Math.round(+v('tbC')||0);if(c){a.c=c;sum.push(`코인 ${c>0?'+':''}${c.toLocaleString()}`);}
 for(const id of ITEM_IDS){const s=v('tbI_'+id);if(s==null||s==='')continue;const n=Math.max(0,Math.min(99,Math.round(+s||0))),had=+(e.it||{})[id]||0;if(n!==had){a.it[id]=n;sum.push(`${ITEMS[id].name} ${had}→${n}개`);}}
 for(const k in e.d||{}){const n=Math.max(0,Math.round(+v('tbD_'+k)||0));if(n>0&&DECO[k]){a.d[k]=-n;sum.push(`${DECO[k].name} −${n}`);}}

 if(($('tbRf')||{}).checked&&(Object.keys(a.it).length||Object.values(a.d).some(x=>x<0))){a.rf=1;sum.push('줄인 것은 산 값으로 돌려주기');}

 const dupN=L.filter(e=>dup[e.i]).length,newN=L.filter(e=>vnum(e.v)===vnum(APP_VER)).length,anyV=ALL.some(e=>vnum(e.v));

 resume(){if(!R||!R.paused)return;R.paused=false;show('pPause',false);inp.value='';
  // 처음 3·2·1 중이면 아직 낱말이 없으니 남은 숫자부터 이어서 세요. 그 밖에는 3초를 세고 이어져요(그동안 낱말은 가리고 입력 칸은 잠가요)
  if(R.phase==='count'){R.lastCount=0;inp.readOnly=false;inp.focus();return;}
  R.rz=3;R.rzN=4;inp.readOnly=true;inp.blur();},
 quit(){if(!R||R.over)return;show('pPause',false);R.paused=false;finishRun('quit');},
 'slot-tip'(el){if(!R)return;const id=R.bag[+el.dataset.i];if(id){const nm=itName(id);toast(R.en?`'${nm}' 치고 Enter를 눌러야 써요`:`'${nm}'${josa(nm,'을','를')} 치고 Enter를 눌러야 써요`);}inp.focus();},
 sound(){OPT.sound=!OPT.sound;saveOpt();renderProfile();if(OPT.sound)SFX.tick();},
 season(){OPT.season=OPT.season===false;saveOpt();renderProfile();SFX.tick();const se=seasonNow();ttoast(OPT.season?`${SEA_ICON[se]} ${SEA_NAME[se]} 모습으로 바꿨어요`:'계절 모습을 껐어요. 언제나 여름 모습이에요');},
 full(){try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>ttoast('이 화면에서는 전체 화면을 쓸 수 없어요'));}}catch(e){ttoast('이 화면에서는 전체 화면을 쓸 수 없어요');}},
 't-open'(){openTeacher();},
 't-pin'(){const v=(($('tPin')||{}).value||'').trim();if(HANGUL.test(v)){$('tPinMsg').textContent='한글이 섞여 들어갔어요. 한/영 키를 눌러 영어로 바꾼 뒤 다시 입력해 주세요.';$('tPin').value='';$('tPin').focus();return;}
  if(hash('pin:'+v+SALT)===PIN_H){TUNLOCK=true;TPIN=v;tArm='';renderTeacher();teacherPull();}else{$('tPinMsg').textContent='비밀번호가 달라요'+(pinCaps?' (Caps Lock이 켜져 있어요)':'');$('tPin').value='';$('tPin').focus();}},
 't-close'(){show('pTeacher',false);tArm='';tmEdit='';tmDel='';if(!SAVE)openReg();else if(scr==='home')goHome();},
 't-tab'(el){tTab=el.dataset.t;tArm='';tmEdit='';tmDel='';renderTeacher();if(SYNC&&tTab==='class'&&tSum&&!TCLS)tClsPull();if(SYNC&&((tTab==='class'&&!tLive)||(tTab==='manage'&&!tLoading&&(!(tLive&&tLive.full)||Date.now()-tLive.t>30000))))teacherPull();},
 'tm-edit'(el){if(tmBusy)return;tmEdit=el.dataset.t;tmDel='';renderTeacher();setTimeout(()=>{const x=$('tmName');if(x){x.focus();x.select();}},30);},
 'tm-del'(el){if(tmBusy)return;tmDel=el.dataset.t;tmEdit='';renderTeacher();},
 'tm-cancel'(){tmEdit='';tmDel='';renderTeacher();},
 'tm-view'(el){tmView=el.dataset.v==='bag'?'bag':'list';tBagSel='';tBagMsg=null;tBagFresh=true;tmEdit='';tmDel='';renderTeacher();if(tmView==='bag'&&SYNC&&!tLoading&&!(tLive&&tLive.full))teacherPull();},
 'tb-open'(el){tBagSel=el.dataset.t;tBagMsg=null;tBagFresh=true;renderTeacher();},
 'tb-back'(){tBagSel='';tBagMsg=null;tBagFresh=true;renderTeacher();},
 'tb-refresh'(){if(tBag&&tBag.key)tBagLoad(tBag.key);renderTeacher();},
 'tb-send'(){tBagSend();},
 'tb-cancel'(el){tBagCancel(el.dataset.r);},
 'tm-save'(){tmSave();},
 'tm-delok'(){tmDelete();},
 'tr-game'(el){tG=el.dataset.g;renderTeacher();},'tr-metric'(el){tM=el.dataset.m;renderTeacher();},
 'tr-cls'(el){tCls=el.dataset.c;tBagSel='';tBagMsg=null;tBagFresh=true;renderTeacher();},
 't-add'(){teacherAdd();},
 't-refresh'(){if(tTab==='class'&&tSum)tClsPull();else teacherPull();},
 't-sum'(el){tSum=el.dataset.v==='1';renderTeacher();if(tSum){if(!TCLS||Date.now()-TCLS.t>30000)tClsPull();}else if(SYNC&&!tLive)teacherPull();},
 't-mon'(){const gr=parseInt(($('tpGr')||{}).value,10),cl=parseInt(($('tpCl')||{}).value,10);if(!(gr>=1&&gr<=6)||!(cl>=1&&cl<=20)){$('tPzMsg').textContent='학년과 반을 확인해 주세요';return;}store.set('taja2_tpz',{gr,cl});tMonLoad(gr,cl);},
 't-star'(el){tMonStar(+el.dataset.d);},
 't-fund'(){const gr=parseInt(($('tpGr')||{}).value,10),cl=parseInt(($('tpCl')||{}).value,10);if(!(gr>=1&&gr<=6)||!(cl>=1&&cl<=20)){$('tPzMsg').textContent='학년과 반을 확인해 주세요';return;}store.set('taja2_tpz',{gr,cl});tFundLoad(gr,cl);},
 't-plaza'(){const gr=parseInt(($('tpGr')||{}).value,10),cl=parseInt(($('tpCl')||{}).value,10);if(!(gr>=1&&gr<=6)||!(cl>=1&&cl<=20)){$('tPzMsg').textContent='학년과 반을 확인해 주세요';return;}
  store.set('taja2_tpz',{gr,cl});show('pTeacher',false);openEditor('plaza',{gr,cl,admin:true});},
 'rk-refresh'(){openRank();},
 'me-push'(){renderMe(null,{t:'보내는 중…'});syncPush().then(ok=>{if(SAVE&&!$('pMe').classList.contains('hidden'))renderMe(null,ok?{t:'보냈어요!',ok:true}:{t:'보내지 못했어요. 잠시 뒤에 다시 해 보세요.'});});},
 't-classcode'(){const L=tList().filter(e=>tCls==='all'||clsKey(e)===tCls);if(!L.length){renderTeacher(null,{t:'먼저 학생 코드를 추가해 주세요'});return;}renderTeacher(enc('TJR1',{t:Date.now(),list:L.map(e=>({i:e.i,gr:e.gr,cl:e.cl,n:e.n,b:e.b,lv:e.lv,g:e.g,ts:e.ts}))}));},
 't-clear'(){if(tArm!=='clear'){tArm='clear';renderTeacher();return;}store.set('taja2_teacher',{list:[]});tArm='';renderTeacher(null,{t:'목록을 비웠어요',ok:true});},
 't-saveprof'(){const v=readInfo('t');if(v.err){$('tDevMsg').textContent=v.err;return;}Object.assign(SAVE,{gr:v.gr,cl:v.cl,no:v.no,name:v.name});saveGame();syncPush(TPIN);renderTeacher(null,{t:'학생 정보를 저장했어요',ok:true});},
 't-give'(){const n=parseInt($('tGive').value,10);if(!n){renderTeacher(null,{t:'숫자를 써 주세요'});return;}{const b0=SAVE.coins;SAVE.coins=Math.max(0,SAVE.coins+n);clog('tg','',1,SAVE.coins-b0);}saveGame();bagSync(1500);renderTeacher(null,{t:`${n>0?'+':''}${n} 코인 → 지금 ${SAVE.coins} 코인`,ok:true});},
 't-reset'(){if(tArm!=='reset'){tArm='reset';renderTeacher();return;}if(SAVE)syncDelete(SAVE.id);try{localStorage.removeItem(SKEY);localStorage.removeItem('taja2_classview');localStorage.removeItem('taja2_live');localStorage.removeItem('taja2_cls');}catch(e){}CLS=null;liveMem=null;SAVE=null;tArm='';show('pTeacher',false);goHome();}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){f(b);}});
document.querySelectorAll('#hud .pbtn,#hud .qbtn').forEach(b=>b.addEventListener('pointerdown',e=>e.preventDefault()));
$('slots').addEventListener('pointerdown',e=>{if(e.target.closest('.slot[data-i]'))e.preventDefault();});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){const id=(e.target&&e.target.id)||'';
 if(/^r(Gr|Cl|No|Name)$/.test(id)){e.preventDefault();ACT[$('pReg').querySelector('[data-act=info-save]')?'info-save':'reg-save']();}
 else if(id==='tPin'){e.preventDefault();ACT['t-pin']();}
 else if(id==='gAmt'){e.preventDefault();ACT['give-go']();}
 else if(id==='tpCl'){e.preventDefault();ACT['t-plaza']();}
 else if(id==='tmName'||id==='tmNo'){e.preventDefault();tmSave();}}});

document.addEventListener('input',e=>{if(e.target&&e.target.id==='gAmt'&&GV){GV.amt=Math.max(0,Math.floor(+e.target.value||0));GV.arm=false;GV.ok=false;giveSync();}});
/* 선생님 비밀번호 칸: 한글 상태·Caps Lock 알림 */
const HANGUL=/[ㄱ-ㅎㅏ-ㅣ가-힣]/;let pinCaps=false,pinKo=false;
function pinCheck(e){const el=$('tPin'),m=$('tPinMsg');if(!el||!m)return;
 if(e.getModifierState)pinCaps=!!e.getModifierState('CapsLock');
 if(e.type==='keydown'){const k=e.key||'';
  if(k==='HangulMode'||k==='Lang1'||k==='HanjaMode')pinKo=false;
  else if(k==='Process'||e.keyCode===229||HANGUL.test(k))pinKo=true;
  else if(k.length===1)pinKo=false;}
 else if(e.type==='compositionstart'||e.type==='compositionupdate')pinKo=true;
 const hasKo=HANGUL.test(el.value);
 m.textContent=pinKo?'⌨️ 한글로 입력되고 있어요. 한/영 키를 눌러 영어로 바꿔 주세요.':hasKo?'⌨️ 한글이 섞여 있어요. 칸을 지우고 영어로 다시 입력해 주세요.':pinCaps?'⇪ Caps Lock이 켜져 있어요. 끄고 입력해 주세요.':'';}
['keydown','input','compositionstart','compositionupdate'].forEach(t=>document.addEventListener(t,e=>{if(e.target&&e.target.id==='tPin')pinCheck(e);},true));

/* 붙여넣기 막기 (2026-11-12): 게임 낱말은 직접 쳐야 해요 (Ctrl+V, 오른쪽 클릭, 클립보드 기록, 끌어다 놓기) */
const noPaste=e=>{e.preventDefault();if(R&&!R.over)toast('붙여넣기는 쓸 수 없어요. 직접 쳐야 해요');};
inp.addEventListener('paste',noPaste);inp.addEventListener('drop',noPaste);inp.addEventListener('dragover',e=>{e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='none';});
inp.addEventListener('beforeinput',e=>{if(/^insertFrom(Paste|Drop|Yank)/.test(e.inputType||''))noPaste(e);});
/* 한글 입력(IME): 조합 중 Enter는 조합이 끝난 뒤 처리 */
let pendingEnter=false;
inp.addEventListener('compositionend',()=>{if(pendingEnter){pendingEnter=false;setTimeout(()=>submit(inp.value),0);}});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(e.isComposing||e.keyCode===229){pendingEnter=true;return;}submit(inp.value);}});
inp.addEventListener('input',()=>{const v=inp.value;if(!R)return;
 if(v.endsWith(' ')){const t=nkey(v);if(!t){inp.value='';return;}
  const alive=R.ents.filter(e=>e.state==='alive'),spaced=alive.some(e=>e.word.includes(' ')),
   exact=alive.some(e=>nkey(e.word)===t)||R.bag.some(id=>itName(id)===t),longer=alive.some(e=>nkey(e.word).startsWith(t+' '));
  // 'go'와 'go camping'이 함께 있으면 스페이스바로 끊지 않고 끝까지 치게 해요(Enter를 누르면 'go')
  if((exact&&!longer)||!spaced)submit(v);return;}
 if(R.en){if(HANGUL.test(v))toast('한/영 키를 눌러 영어로 바꿔요! ⌨️');}else if(/[a-z]/i.test(v))toast('한/영 키를 눌러 한글로 바꿔요!');});
// Caps Lock 알림 (대문자까지 정확하게 쳐야 해서)
function capsCheck(e){if(!e.getModifierState)return;const on=!!e.getModifierState('CapsLock');$('capsNote').classList.toggle('show',on);inp.classList.toggle('caps',on);}
inp.addEventListener('keydown',capsCheck);inp.addEventListener('keyup',capsCheck);
inp.addEventListener('animationend',()=>inp.classList.remove('bad'));
document.addEventListener('keydown',e=>{if(scr!=='game'||!R)return;if(e.key==='Escape'){e.preventDefault();if(R.over||e.repeat)return;if(R.paused)ACT.resume();else if((R.pauses|0)>=PAUSE_MAX)ACT.quit();else ACT.pause();return;}if(!R.paused&&!R.over&&document.activeElement!==inp)inp.focus();});
// 마을 꾸미기 단축키
document.addEventListener('keydown',e=>{if(scr!=='edit'||!ED||panelOpen())return;const tg=e.target;if(tg&&/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName))return;const k=e.key;
 if(k==='Escape'){e.preventDefault();edCancel();}
 else if(k==='f'||k==='F'||k==='ㄹ'){e.preventDefault();ACT['ed-flip']();}
 else if((k==='Delete'||k==='Backspace')&&ED.sel&&ED.mode==='deco'){e.preventDefault();ACT['ed-store']();}
 else if(k==='+'||k==='='){edZoom(1.2);}else if(k==='-'||k==='_'){edZoom(1/1.2);}
 else if(k.startsWith('Arrow')){e.preventDefault();const s=48;if(k==='ArrowLeft')ED.cam.x+=s;else if(k==='ArrowRight')ED.cam.x-=s;else if(k==='ArrowUp')ED.cam.y+=s;else ED.cam.y-=s;clampCam();}});
function toStage(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{if(scr==='game'&&R&&!R.paused&&!R.over){e.preventDefault();inp.focus();}else if(scr==='edit'&&ED){e.preventDefault();edDown(e);}else if(scr==='home'&&SAVE&&!panelOpen()){e.preventDefault();homeDown(e);}});
window.addEventListener('pointermove',e=>{if(scr==='edit'&&ED)edMove(e);else if(hDrag)homeMove(e);});
window.addEventListener('pointerup',e=>{if(scr==='edit'&&ED)edUp(e);else if(hDrag||HPTRS.size)homeUp(e);});
window.addEventListener('pointercancel',e=>{PTRS.delete(e.pointerId);HPTRS.delete(e.pointerId);if(!HPTRS.size)hDrag=null;if(ED&&ED.drag&&ED.drag.type!=='pinch'){if(ED.carry&&ED.carry.drag)edCancel();ED.drag=null;}});
cv.addEventListener('wheel',e=>{const f=Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015));if(scr==='edit'&&ED){e.preventDefault();edZoom(f,toStage(e));}else if(scr==='home'&&SAVE&&!panelOpen()){e.preventDefault();homeZoom(f,toStage(e));}},{passive:false});
cv.addEventListener('contextmenu',e=>{if(scr==='edit')e.preventDefault();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scr==='game'&&R&&!R.over&&!R.paused){if((R.pauses|0)>=PAUSE_MAX)finishRun('away');else pauseGame('away');}
 if(!document.hidden){if(Date.now()-UPD.last>30000)updCheck(true);else updMaybe();}});
setInterval(()=>{if(UPD.ready)updMaybe();else updCheck();},15000);
setTimeout(()=>updCheck(true),20000+Math.random()*20000);
window.addEventListener('resize',fit);

/* ================= 시작 ================= */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;ANIM_T+=dt;ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
 SEA=scr==='game'||OPT.season===false?'':(SEA_FORCE||seasonNow());
 if(scr==='game'&&R){update(dt);if(R)drawGame();}else if(scr==='edit'&&ED)drawEditor();else drawHome(ANIM_T);
 requestAnimationFrame(loop);}
fit();goHome();
if(SYNC&&SAVE)setTimeout(syncPush,1500);
if(UPD.done)setTimeout(()=>ttoast('✨ 새 버전으로 바뀌었어요!'),900);
let bootT=3200;if(SAVE&&SAVE.xbBack){delete SAVE.xbBack;saveGame();setTimeout(()=>ttoast('🧺 예전 화면에서 안 보이던 새 장식을 다시 꺼내 놓았어요'),bootT);bootT+=3600;}
if(SAVE&&SAVE.icapMsg){const[m,b]=SAVE.icapMsg;delete SAVE.icapMsg;saveGame();setTimeout(()=>ttoast(`🎒 아이템은 종류마다 ${ITEM_MAX}개까지 가질 수 있어요. 넘는 아이템 ${m}개는 ${(+b).toLocaleString()}코인으로 돌려받았어요`),bootT);}
requestAnimationFrame(loop);
})();
</script>
