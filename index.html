<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 타자 마을</title>
<script>
/* ============================================================
   반 랭킹 자동 연동 주소
   구글 Apps Script 웹 앱 주소(https://script.google.com/macros/s/…/exec)를
   아래 따옴표 안에 붙여 넣으면 자동 연동이 켜져요. 비워 두면 꺼져요.
   ============================================================ */
window.TAJA_SYNC_URL = 'https://script.google.com/macros/s/AKfycbw6gZXufTAuKirWz9M2cmYoUgGc7UKmGDJVymQb9nPFBIuTUBK718gx6SfSFFVN_T7T/exec';
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a1f2b;--steel:#2f2f35}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#16202c;overflow:hidden;font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;word-break:keep-all}
input,textarea{user-select:text;-webkit-user-select:text;font-family:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#7cc6ee}
#cv{position:absolute;left:0;top:0;width:1280px;height:720px}
.screen{position:absolute;inset:0}
.hidden{display:none!important}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc928 55%,#e09a00);border:.09em solid #9a6400;box-shadow:inset 0 0 0 .13em rgba(255,255,255,.35);vertical-align:-.14em}

/* ---------- 홈 ---------- */
#home{pointer-events:none}
#home>*{pointer-events:auto}
.logo2{position:absolute;left:0;right:0;top:10px;text-align:center;pointer-events:none!important;line-height:1;white-space:nowrap}
.logo2 span{display:inline-block;paint-order:stroke fill;filter:drop-shadow(0 3px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 8px 6px rgba(0,0,0,.22))}
.logo2 .l1{font-size:34px;color:#ffae1f;-webkit-text-stroke:9px var(--ink);transform:rotate(-5deg);margin-right:12px;vertical-align:18px}
.logo2 .l2{font-size:72px;color:#ff5fa8;-webkit-text-stroke:13px var(--ink);letter-spacing:3px}
.pcard{position:absolute;left:16px;top:14px;width:290px;background:rgba(255,255,255,.94);border:4px solid var(--ink);border-radius:22px;padding:8px 16px 10px;box-shadow:0 5px 0 var(--ink)}
.pname{font-size:30px;color:#2a2a30;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:19px;color:#7b4b58;line-height:1.25}
.pcoin{margin-top:2px;font-size:30px;color:#2a2a30}
.topbtns{position:absolute;right:18px;top:14px;display:flex;gap:10px}
.ibtn{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc928 60%,#e59a00);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;position:relative}
.ibtn svg{width:30px;height:30px;fill:var(--ink)}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ibtn .tip{position:absolute;top:66px;white-space:nowrap;background:rgba(40,20,30,.88);color:#fff;font-size:18px;padding:3px 10px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .15s}
.ibtn:hover .tip{opacity:1}
.homebar{position:absolute;left:16px;right:16px;bottom:14px;height:98px;display:flex;gap:12px;align-items:stretch}
.playbtn{flex:0 0 290px;border-radius:999px;background:linear-gradient(#ff8cc0,#ff4f9a);border:5px solid var(--ink);box-shadow:0 7px 0 var(--ink);font-size:44px;color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;white-space:nowrap}
.playbtn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.hb{flex:1 1 0;min-width:0;border-radius:24px;background:linear-gradient(#ffffff,#e8f4ff);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-size:23px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;white-space:nowrap}
.hb .mi{font-size:32px}
.hb.pz{background:linear-gradient(#fff6d6,#ffe08a)}
.hb:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.hometip{position:absolute;left:50%;bottom:122px;transform:translateX(-50%);font-size:19px;color:#fff;background:rgba(20,60,90,.55);border-radius:999px;padding:3px 16px;pointer-events:none!important;white-space:nowrap}
#ttoast{position:absolute;left:50%;top:548px;transform:translateX(-50%);background:rgba(40,20,30,.93);color:#fff;font-size:26px;padding:10px 26px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:50}
#ttoast.show{opacity:1}
#ttoast.top{top:92px}
#cv{touch-action:none}
.form select{height:58px;border:4px solid var(--steel);border-radius:16px;font-size:26px;padding:0 6px;outline:none;width:132px;background:#fff;font-family:inherit;color:#2a2a30}
.form.reg input{width:230px}
.form.reg input[type=number]{width:100px}
.namehelp{font-size:20px;color:#5d4b2a;background:#fff8db;border:3px dashed #f0b400;border-radius:14px;padding:8px 14px;margin:4px auto 2px;max-width:780px;line-height:1.4}
.namehelp b{font-weight:normal;color:#d6336c}

/* ---------- 마을 꾸미기 · 광장 ---------- */
#decoUI{pointer-events:none}
#decoUI>*{pointer-events:auto}
.dbar{position:absolute;left:12px;right:12px;top:10px;height:68px;background:rgba(255,255,255,.95);border:4px solid var(--ink);border-radius:22px;display:flex;align-items:center;gap:10px;padding:0 12px}
.dbar b{font-size:28px;font-weight:normal;white-space:nowrap}
#dHint{font-size:16px;color:#6a3b48;flex:1;line-height:1.2;overflow:hidden;max-height:42px;min-width:0}
.dextra{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.dcoin{font-size:24px;background:#2a2a30;color:#fff;border-radius:999px;padding:2px 14px;white-space:nowrap}
.dchip{font-size:18px;background:#fff3b8;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;white-space:nowrap}
.dbar .gbtn,.dbar .sbtn{display:inline-block;width:auto;flex:0 0 auto;margin:0;white-space:nowrap}
.dzoom{position:absolute;right:14px;top:92px;display:flex;flex-direction:column;gap:8px}
.dzoom button{width:52px;height:52px;border-radius:16px;background:#fff;border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center}
.dzoom button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.dact{position:absolute;right:22px;bottom:140px;background:#fffbea;border:3px solid var(--ink);border-radius:16px;padding:4px 8px;display:flex;gap:6px;align-items:center;white-space:nowrap;box-shadow:0 3px 0 var(--ink);z-index:2}
.dact b{font-size:22px;font-weight:normal;margin:0 4px}
.dact span{font-size:18px;color:#6a3b48}
.dact .sbtn{display:inline-block;width:auto;margin:0;font-size:20px;padding:2px 12px;box-shadow:0 3px 0 var(--ink)}
.dpal{position:absolute;left:12px;right:12px;bottom:10px;height:182px;background:rgba(255,255,255,.94);border:4px solid var(--ink);border-radius:22px;padding:6px 10px 8px;display:flex;flex-direction:column;gap:6px}
.dcats{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;min-height:36px}
.dnote{font-size:17px;color:#7b4b58;margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dstore{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;flex:1;align-items:center;padding:2px 2px 4px}
.dstore::-webkit-scrollbar{height:9px}.dstore::-webkit-scrollbar-thumb{background:#c9ccd3;border-radius:9px}.dstore::-webkit-scrollbar-track{background:transparent}
.dcard{flex:0 0 auto;width:102px;height:108px;border:3px solid var(--steel);border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;line-height:1.1}
.dcard.on{background:#fff3b8;border-color:#d6336c;box-shadow:0 0 0 3px #d6336c}
.dcard.buy{background:#f3f4f7}
.dcard canvas{width:74px;height:74px}
.dcard span{font-size:16px;white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.dcard i{position:absolute;right:5px;top:4px;font-style:normal;font-size:17px;background:var(--ink);color:#fff;border-radius:999px;padding:0 7px}
.dcard i.pr{background:#fff3b8;color:#4a1f2b;border:2px solid #e0a800;font-size:15px;padding:0 6px 0 4px}
.dcard i.pr .coin{margin-right:2px}
.dcard em{position:absolute;left:5px;top:5px;font-style:normal;font-size:13px;color:#fff;background:#4fa3d6;border-radius:6px;padding:0 4px}
.dcard.tile .sw{display:block;width:64px;height:34px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);margin:10px 0 14px}
.dempty{font-size:21px;color:#7b4b58;padding:0 20px}
.grid.g5{grid-template-columns:repeat(5,1fr)}

/* ---------- HUD ---------- */
#hud{pointer-events:none}
#hud .inbar,#hud .pbtn,#hud .slots{pointer-events:auto}
.hearts{position:absolute;left:84px;top:30px;height:46px;padding:0 36px 0 30px;background:linear-gradient(90deg,rgba(18,18,24,.88) 75%,rgba(18,18,24,0));display:flex;gap:3px;align-items:center;border-radius:0 24px 24px 0}
.hearts i{display:block;width:27px;height:25px}
.hearts svg{width:100%;height:100%;fill:#ff3d55;stroke:#7a0f1c;stroke-width:1.5}
.hearts i.off svg{fill:#4b4b55;stroke:#2a2a30}
.rbadge{position:absolute;left:18px;top:12px;width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c2,#ffcd3c 55%,#e08e00);border:4px solid var(--steel);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:#2a2a30;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.rbadge small{font-size:15px}.rbadge b{font-size:40px;font-weight:normal}
.rprog{position:absolute;left:490px;top:16px;width:300px;background:rgba(18,18,24,.86);border:3px solid #fff;border-radius:20px;padding:6px 14px 10px;color:#fff;text-align:center;font-size:24px}
.rprog .bar{height:12px;border-radius:999px;background:#454552;margin-top:4px;overflow:hidden}
.rprog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ad7ff,#ffe066);border-radius:999px;transition:width .2s}
.hcoin{position:absolute;right:18px;top:22px;min-width:200px;height:60px;background:linear-gradient(90deg,rgba(15,15,18,0),#111 25%);color:#fff;font-size:42px;text-align:right;padding-right:20px;line-height:60px;border-radius:12px}
.hcoin .coin{margin-right:10px}
.hcoin.dbl{color:#ffe14d}
.combo{position:absolute;right:28px;top:90px;font-size:32px;color:#ffe14d;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill}
.effects{position:absolute;left:112px;top:84px;display:flex;gap:6px}
.eff{background:rgba(18,18,24,.86);color:#fff;border-radius:999px;padding:3px 14px;font-size:22px}
.inbar{position:absolute;left:320px;top:638px;width:640px;height:66px}
#inp{width:100%;height:100%;border-radius:22px;border:4px solid var(--steel);background:linear-gradient(#ffffff,#e6eaf0);font-size:34px;text-align:center;color:#222;outline:none;box-shadow:0 5px 0 var(--steel)}
#inp::placeholder{color:#a3a9b3;font-size:24px}
#inp.bad{animation:shake .32s}
#inp.caps{border-color:#f59f00}
.capsnote{position:absolute;left:340px;top:604px;padding:2px 14px 4px;border-radius:12px 12px 0 0;background:#ffe066;border:3px solid var(--steel);border-bottom:none;font-size:20px;color:#4a1f2b;display:none}
.capsnote.show{display:block}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.pbtn{position:absolute;left:986px;top:640px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c3c9d0 55%,#7d858e);border:4px solid var(--steel);box-shadow:0 4px 0 var(--steel);display:flex;align-items:center;justify-content:center}
.pbtn svg{width:26px;height:26px;fill:#26262c}
.toast{position:absolute;left:50%;top:552px;transform:translateX(-50%);background:rgba(30,20,40,.93);color:#fff;font-size:26px;padding:10px 26px;border-radius:999px;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:210px;color:#fff;-webkit-text-stroke:20px var(--ink);paint-order:stroke fill;pointer-events:none;opacity:0}
#count.pop{animation:pop .9s ease-out forwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.15);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.slots{position:absolute;left:24px;top:632px;display:flex;gap:8px}
.slot{width:86px;height:74px;border-radius:16px;border:4px solid var(--steel);background:rgba(255,255,255,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--steel);line-height:1.05}
.slot .ic{font-size:30px}
.slot .nm{font-size:19px;color:#2a2a30;white-space:nowrap}
.slot.empty{background:rgba(255,255,255,.35);border-style:dashed;box-shadow:none}
.slot.empty .nm{color:rgba(40,40,48,.65);font-size:17px}
.slot.new{animation:slotpop .6s}
.slot.hot{outline:4px solid #d6336c;outline-offset:2px}
@keyframes slotpop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
#hud .slots.s4{left:12px;gap:4px}
#hud .slots.s4 .slot{width:72px}

/* ---------- 패널 ---------- */
.overlay{position:absolute;inset:0;background:rgba(10,15,30,.5);display:flex;align-items:center;justify-content:center;z-index:10}
.panel{background:linear-gradient(#ffffff,#dde2e9);border:5px solid var(--steel);border-radius:32px;box-shadow:0 10px 0 var(--steel),0 24px 50px rgba(0,0,0,.4);padding:24px 36px 22px;text-align:center;width:500px;max-height:690px;overflow:auto}
.panel.wide{width:860px}
.panel.xl{width:1160px}
.panel h2{font-size:46px;font-weight:normal;margin-bottom:6px;color:#2a2a30}
.panel h3{font-size:26px;font-weight:normal;margin:10px 0 4px;color:#2a2a30;text-align:left}
.panel .sub{font-size:21px;color:#5d5f68;margin-bottom:10px}
.gbtn,.sbtn{display:block;width:100%;margin:10px 0;padding:8px 24px;font-size:32px;border:4px solid var(--ink);border-radius:999px;box-shadow:0 5px 0 var(--ink)}
.gbtn{background:linear-gradient(#ffe36b,#f7b500)}
.sbtn{background:linear-gradient(#ffffff,#e9e9ee);font-size:27px}
.gbtn small{display:block;font-size:18px;opacity:.75;margin-top:-2px}
.gbtn:active,.sbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.inline{display:inline-block;width:auto;margin:0 6px;min-width:170px}
.sm{font-size:22px;padding:4px 16px;min-width:0;margin:0;box-shadow:0 3px 0 var(--ink)}
.btnrow{margin-top:14px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.linkbtn{font-size:20px;color:#6b6d75;text-decoration:underline;margin-top:6px}
.form{display:flex;gap:14px;justify-content:center;margin:10px 0}
.form label{display:flex;flex-direction:column;align-items:flex-start;font-size:20px;color:#5d5f68;gap:4px}
.form input{height:58px;border:4px solid var(--steel);border-radius:16px;font-size:30px;text-align:center;outline:none;width:260px}
.form input[type=number]{width:110px}
.msg{font-size:21px;color:#d0263a;min-height:26px}
.ok{color:#2b8a3e}
.tabs{display:flex;justify-content:center;gap:8px;margin:6px 0 10px;flex-wrap:wrap}
.chip{border:3px solid var(--ink);border-radius:999px;background:#fff;padding:4px 16px;font-size:23px;white-space:nowrap}
.chip.on{background:linear-gradient(#ffe36b,#f7b500);box-shadow:0 3px 0 var(--ink)}
.chip.sm2{font-size:20px;padding:3px 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 10px}
.tile{background:#fff;border:3px solid var(--steel);border-radius:18px;padding:6px 4px}
.tile small{display:block;font-size:19px;color:#6b6d75}
.tile b{font-size:34px;font-weight:normal;color:#2a2a30}
.badges{display:flex;justify-content:center;gap:8px;margin:4px 0 8px;flex-wrap:wrap}
.badge{background:#ff5fa8;color:#fff;border-radius:999px;padding:4px 16px;font-size:22px;border:3px solid var(--ink)}
.coinlist{background:#fff;border:3px solid var(--steel);border-radius:18px;padding:8px 18px;text-align:left;font-size:21px;color:#3a3a40;display:grid;grid-template-columns:1fr 1fr;column-gap:36px}
.coinlist div{display:flex;justify-content:space-between;padding:2px 0}
.coinlist .tot{grid-column:1/-1;border-top:2px dashed #c9ccd3;margin-top:4px;padding-top:6px;font-size:32px;color:#2a2a30}
.stats.six{grid-template-columns:repeat(6,1fr);gap:8px}
.stats.six .tile b{font-size:27px}
.stats.six .tile small{font-size:17px}
.rankbox{max-height:300px;overflow:auto;margin:8px 0;border-radius:16px;background:#fff;border:3px solid var(--steel)}
table.rank{width:100%;border-collapse:collapse;font-size:23px}
table.rank th{position:sticky;top:0;background:#2a2a30;color:#fff;font-weight:normal;padding:6px}
table.rank td{padding:5px 6px;border-top:1px solid #e3e5ea}
table.rank tr.me td{background:#fff3b8}
/* 선생님 모드 [학생 관리] */
table.rank.mg{font-size:21px}
table.rank.mg td{vertical-align:middle}
table.rank tr.dup td{background:#ffefc2}
table.rank tr.grp td{background:#eef1f6;font-size:19px;color:#4b4f5c;text-align:left;padding:3px 12px}
table.rank tr.edit td,table.rank tr.del td{background:#fff7e6}
table.rank tr.del td{text-align:left;padding:8px 12px;line-height:1.5}
table.rank tr.del small{color:#a3273a;font-size:18px}
table.rank input{height:44px;border:3px solid var(--steel);border-radius:12px;font-size:23px;text-align:center;outline:none;font-family:inherit}
table.rank input#tmNo{width:78px}
table.rank input#tmName{width:210px}
table.rank .hint{font-size:16px;color:#6b6d75}
.dupnote{display:inline-block;margin-left:6px;font-size:16px;color:#8a4b00;background:#ffd66b;border-radius:999px;padding:0 9px;vertical-align:middle}
table.rank .tn{display:inline-block;margin-left:6px;font-size:15px;color:#3f5fa8;vertical-align:middle}
.mgbtns{white-space:nowrap}
.mgbtns .sbtn,.mgbtns .gbtn{display:inline-block;width:auto;margin:0 2px;font-size:19px;padding:2px 12px;box-shadow:0 3px 0 var(--ink)}
.sbtn.danger{background:linear-gradient(#fff0f0,#ffb8b8)}
.medal{display:inline-block;width:32px;height:32px;line-height:32px;border-radius:50%;color:#fff;font-size:20px}
.m1{background:#f2b705}.m2{background:#9aa3ad}.m3{background:#c77b3a}
.empty{padding:26px;font-size:23px;color:#777}
.note{font-size:19px;color:#6b6d75;margin-top:6px}
textarea.code{width:100%;height:76px;border:3px solid var(--steel);border-radius:14px;padding:8px 12px;font-size:16px;font-family:monospace;resize:none;outline:none;word-break:break-all}
.coderow{display:flex;gap:8px;align-items:stretch;margin:6px 0}
.coderow textarea{flex:1}
.coderow .gbtn,.coderow .sbtn{width:auto;margin:0;min-width:120px;font-size:24px}
/* 상점 */
.shophead{display:flex;align-items:center;justify-content:space-between}
.wallet{font-size:36px;background:#2a2a30;color:#fff;border-radius:999px;padding:4px 22px}
.wallet .coin{margin-right:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-height:540px;overflow:auto;padding:4px 4px 8px}
.scard{background:#fff;border:3px solid var(--steel);border-radius:18px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:3px}
.scard .ic{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:36px}
.scard canvas{width:72px;height:72px;border-radius:14px;background:#e8f6ff}
.scard b{font-size:22px;font-weight:normal;color:#2a2a30}
.scard .d{font-size:16px;color:#666;min-height:40px;line-height:1.25}
.scard .own{font-size:17px;color:#7b4b58}

 4:['가는 말이 고와야 오는 말이 곱다','티끌 모아 태산','세 살 버릇 여든까지 간다','백지장도 맞들면 낫다','낮말은 새가 듣고 밤말은 쥐가 듣는다','원숭이도 나무에서 떨어진다','천 리 길도 한 걸음부터','등잔 밑이 어둡다','소 잃고 외양간 고친다','발 없는 말이 천 리 간다','고래 싸움에 새우 등 터진다','빈 수레가 요란하다','콩 심은 데 콩 난다','우물 안 개구리','누워서 떡 먹기','하늘이 무너져도 솟아날 구멍이 있다','작은 고추가 더 맵다','호랑이도 제 말 하면 온다','구슬이 서 말이라도 꿰어야 보배','윗물이 맑아야 아랫물이 맑다','돌다리도 두들겨 보고 건너라','아니 땐 굴뚝에 연기 날까','꿩 먹고 알 먹기','될성부른 나무는 떡잎부터 알아본다']};

 // 영어판: 80% 속도에서 시작해 천천히 빨라지고, 한꺼번에 최대 6개, 간격도 넉넉하게

const wordsFor=r=>{const n=Math.min(25,8+r);return r%5===0?Math.ceil(n/3):n;};
const lenF=(w,en)=>{const n=[...w.replace(/\s/g,'').replace(PUNC,'')].length;if(en)return n<=4?1:n<=6?.85:n<=9?.72:n<=13?.62:.55;return n<=3?1:n<=5?.85:n<=8?.72:.6;};

// 영어판: 기본 낱말 → 6학년 교과 낱말 → 두세 낱말 표현 순서 (문장은 보스만)
function tierMixEn(r){if(r<=5)return[[1,1]];if(r<=10)return[[1,.7],[2,.3]];if(r<=15)return[[1,.3],[2,.6],[3,.1]];if(r<=19)return[[2,.6],[3,.4]];return[[2,.4],[3,.6]];}
function pickTier(r){const mix=(R.en?tierMixEn:tierMix)(r);let x=Math.random(),a=0;for(const[t,p]of mix){a+=p;if(x<=a)return t;}return mix[mix.length-1][0];}
function pickWord(){for(let k=0;k<25;k++){const t=pickTier(R.round);const d=R.deck[t]||(R.deck[t]=[]);if(!d.length)d.push(...shuffle(R.T[t].slice()));const w=d.pop();if(!R.ents.some(e=>e.state==='alive'&&e.word===w))return w;}return R.T[1][Math.floor(Math.random()*R.T[1].length)];}
function roundHint(r){if(R&&R.en)return r%5===0?'보스 별똥별! 대문자·문장부호까지 정확하게':{1:'영어 낱말을 치고 Enter나 스페이스바!',6:'조금 긴 낱말이 섞여요',11:'두세 낱말 표현이 나오기 시작해요',16:'두세 낱말 표현이 많아져요'}[r]||'';

function update(dt){if(R.paused)return;R.t+=dt;

  case 'banner':R.phaseT-=dt;if(R.phaseT<=0){R.phase='play';if(R.round%5===0)spawnBoss();}break;
  case 'clear':R.phaseT-=dt;if(R.phaseT<=0)nextRound();break;

  const p=P(),alive=R.ents.filter(e=>e.state==='alive'&&e.kind==='m').length;
  if(R.freezeT<=0&&R.spawned<R.toSpawn){R.spawnT-=dt;if(alive===0&&R.spawnT>.3)R.spawnT=.3;if(R.spawnT<=0&&alive<p.max){spawnMeteor();R.spawnT=p.interval*rand(.75,1.25);}}
  if(R.giftAt>0&&R.roundT>=R.giftAt){R.giftAt=-1;spawnGift();}}
 for(const e of R.ents)if(e.state==='alive')updEnt(e,dt);

 if(R.phase==='play'&&!R.over&&R.spawned>=R.toSpawn&&!R.boss&&!R.ents.some(e=>e.state==='alive'&&e.kind==='m'))roundClear();}

function placeErr(k,i,j,skip){const s=DECO[k].s,n=edN();if(i<0||j<0||i+s>n||j+s>n)return '섬 밖에는 놓을 수 없어요';
 for(let a=i;a<i+s;a++)for(let b=j;b<j+s;b++){if(ED.mode==='plaza'&&plazaReserved(a,b))return '가운데 길에는 놓을 수 없어요';if(ED.mode==='deco'&&SAVE.deco.ground[a+','+b]==='water')return '물 위에는 놓을 수 없어요';}

function edPlace(){const c=ED.carry,h=ED.hover;if(!c||!h)return false;const why=placeErr(c.k,h.oi,h.oj,c.src==='move'?c.obj:null);if(why){ttoast(why);SFX.miss();return false;}

 if(c.src==='stock'&&(d.stock[c.k]||0)>0){if(!--d.stock[c.k])delete d.stock[c.k];}

 const p=GTYPE[g].price;if(SAVE.coins<p){if(!ED.warned){ED.warned=true;ttoast('코인이 부족해요');}return;}

 SAVE.coins-=c;const ng={};for(const k in d.ground){const[a,b]=k.split(',').map(Number);ng[(a+1)+','+(b+1)]=d.ground[k];}d.ground=ng;for(const o of d.objs){o.i++;o.j++;}d.n=nx;

/* 화면 보기 (끌기·확대) */
function clampCam(){const n=edN(),z=ED.cam.z,L=ED.cam.x-n*IW*z,Rr=ED.cam.x+n*IW*z,T=ED.cam.y-130*z,B=ED.cam.y+(n*TLH+22)*z;
 if(Rr<220)ED.cam.x+=220-Rr;if(L>1060)ED.cam.x-=L-1060;if(B<220)ED.cam.y+=220-B;if(T>500)ED.cam.y-=T-500;}
function edZoom(f,p){p=p||{x:640,y:316};const z0=ED.cam.z,z=Math.max(.35,Math.min(2.6,z0*f)),k=z/z0;ED.cam.x=p.x-(p.x-ED.cam.x)*k;ED.cam.y=p.y-(p.y-ED.cam.y)*k;ED.cam.z=z;clampCam();}
function edPoint(e){const p=toStage(e),z=ED.cam.z,wx=(p.x-ED.cam.x)/z,wy=(p.y-ED.cam.y)/z;return{sx:p.x,sy:p.y,wx,wy,fi:(wy/IH+wx/IW)/2,fj:(wy/IH-wx/IW)/2};}
function edHover(pt){const s=ED.carry?DECO[ED.carry.k].s:1;ED.hover={ti:Math.floor(pt.fi),tj:Math.floor(pt.fj),oi:Math.floor(pt.fi-(s-1)/2),oj:Math.floor(pt.fj-(s-1)/2)};}
function inPoly(x,y,P){let inside=false;for(let a=0,b=P.length-1;a<P.length;b=a++){const[xa,ya]=P[a],[xb,yb]=P[b];if((ya>y)!==(yb>y)&&x<(xb-xa)*(y-ya)/(yb-ya)+xa)inside=!inside;}return inside;}
function objPoly(o){const s=sizeOf(o),h=(o.k==='monument'?100:DECO[o.k].h)+14,H=Math.max(10,h-s*IH),T=IP(o.i,o.j),Rt=IP(o.i+s,o.j),B=IP(o.i+s,o.j+s),L=IP(o.i,o.j+s);return[L,B,Rt,up(Rt,H),up(T,H),up(L,H)];}
// 누른 곳에 실제로 그려진 장식을 골라요 (앞에 있는 것부터, 1픽셀 캔버스에 그려 보고 확인)
const PICK=document.createElement('canvas');PICK.width=PICK.height=1;const pctx=PICK.getContext('2d',{willReadFrequently:true});
function pixelHit(o,wx,wy){pctx.setTransform(1,0,0,1,0,0);pctx.clearRect(0,0,1,1);pctx.setTransform(1,0,0,1,-wx,-wy);footDiamond(pctx,o.i,o.j,sizeOf(o),'#000');drawObj(pctx,o,ANIM_T);return pctx.getImageData(0,0,1,1).data[3]>24;}
function hitObj(pt){const list=edObjs().filter(o=>!o.hidden).sort(depthCmp);for(let q=list.length-1;q>=0;q--){const o=list[q];if(inPoly(pt.wx,pt.wy,objPoly(o))&&pixelHit(o,pt.wx,pt.wy))return o;}return null;}
function edDown(e){const pt=edPoint(e);PTRS.set(e.pointerId,{x:pt.sx,y:pt.sy});
 if(PTRS.size>=2){if(ED.carry&&ED.carry.drag)edCancel();const[a,b]=[...PTRS.values()];ED.drag={type:'pinch',d0:Math.max(10,Math.hypot(a.x-b.x,a.y-b.y)),m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},cam0:Object.assign({},ED.cam)};return;}
 try{cv.setPointerCapture(e.pointerId);}catch(_){}
 edHover(pt);const h=ED.hover,n=edN(),onIsland=h.ti>=0&&h.tj>=0&&h.ti<n&&h.tj<n,alt=e.button===1||e.button===2;
 const hit=(!ED.carry&&!ED.paint&&!alt)?hitObj(pt):null;
 ED.drag={type:alt?'pan':ED.paint&&onIsland?'paint':(hit&&ED.mode==='deco')?'obj':'pan',sx:pt.sx,sy:pt.sy,cx:ED.cam.x,cy:ED.cam.y,moved:false,hit};
 if(ED.drag.type==='paint'){ED.warned=false;paintAt(h.ti,h.tj);}}
function edMove(e){const pt=edPoint(e),d=ED.drag;if(PTRS.has(e.pointerId))PTRS.set(e.pointerId,{x:pt.sx,y:pt.sy});
 if(d&&d.type==='pinch'){if(PTRS.size<2)return;const[a,b]=[...PTRS.values()],m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};ED.cam=Object.assign({},d.cam0);edZoom(Math.hypot(a.x-b.x,a.y-b.y)/d.d0,d.m0);ED.cam.x+=m.x-d.m0.x;ED.cam.y+=m.y-d.m0.y;clampCam();return;}
 if(e.target===cv||d)edHover(pt);if(!d)return;
 const dx=pt.sx-d.sx,dy=pt.sy-d.sy;if(!d.moved&&Math.hypot(dx,dy)>6)d.moved=true;
 if(d.type==='pan'){if(d.moved){ED.cam.x=d.cx+dx;ED.cam.y=d.cy+dy;clampCam();}}
 else if(d.type==='paint')paintAt(ED.hover.ti,ED.hover.tj);
 else if(d.type==='obj'&&d.moved&&!ED.carry){const o=d.hit;ED.carry={k:o.k,src:'move',obj:o,f:o.f,drag:true};o.hidden=true;ED.sel=null;edHover(pt);renderAct();setHint();}}
function edUp(e){PTRS.delete(e.pointerId);const d=ED.drag;if(!d)return;if(d.type==='pinch'){if(!PTRS.size)ED.drag=null;return;}ED.drag=null;
 if(d.type==='paint'){if(ED.dirty){ED.dirty=false;saveGame();renderEdBar();SFX.tick();}return;}
 if(ED.carry&&ED.carry.drag){ED.carry.drag=false;edHover(edPoint(e));if(!edPlace())edCancel();return;}
 if(d.moved)return;
 if(ED.carry){edHover(edPoint(e));edPlace();return;}
 const hit=d.hit||hitObj(edPoint(e));ED.sel=hit||null;if(hit)SFX.tick();renderAct();setHint();}

 try{const r=await tmo(fetch(`${SYNC_URL}${SYNC_URL.includes('?')?'&':'?'}action=plaza&gr=${ed.gr}&cl=${ed.cl}&_=${Date.now()}`),20000);const j=await r.json();if(j&&j.ok&&Array.isArray(j.items))return j.items;}catch(e){}return null;}

 if(ED!==ed)return;ed.pz.loading=false;ed.pz.last=Date.now();
 if(items){const back=setPlaza(items);if(back)ttoast(`광장에서 치워진 내 장식 ${back}개가 창고로 돌아왔어요`);}

function setPlaza(items){const ed=ED,sel=ed.sel;
 ed.pz.items=items.filter(it=>it&&DECO[it.k]&&Number.isFinite(+it.x)&&Number.isFinite(+it.y)).map(it=>({x:+it.x,y:+it.y,k:String(it.k),f:+it.f?1:0,o:String(it.o||''),n:String(it.n||'')}));
 ed.pzObjs=[pzMonument()].concat(ed.pz.items.map(it=>({k:it.k,i:it.x,j:it.y,f:it.f,o:it.o,n:it.n})));
 ed.sel=sel?ed.pzObjs.find(o=>o.i===sel.i&&o.j===sel.j&&o.k===sel.k)||null:null;
 return(!ed.admin&&SAVE&&ed.gr===SAVE.gr&&ed.cl===SAVE.cl)?plazaReconcile():0;}
// 내 창고와 광장을 맞춰요: 광장에서 없어진 내 장식은 창고로 돌아오고, 새로 놓인 내 장식은 창고에서 빠져요.
function plazaReconcile(){const lab=plazaLabel(SAVE.gr,SAVE.cl),me=myTag(),st=SAVE.deco.stock,mine=ED.pz.items.filter(it=>it.o===me),used=new Set(),keep=[];let back=0,changed=false;
 for(const r of SAVE.pz[lab]||[]){const q=mine.findIndex((it,ix)=>!used.has(ix)&&it.x===r.x&&it.y===r.y&&it.k===r.k);if(q>=0){used.add(q);keep.push(r);}else if(DECO[r.k]){st[r.k]=(st[r.k]||0)+1;back++;changed=true;}}
 mine.forEach((it,ix)=>{if(used.has(ix))return;keep.push({x:it.x,y:it.y,k:it.k});if(st[it.k]>0&&!--st[it.k])delete st[it.k];changed=true;});
 SAVE.pz[lab]=keep;if(changed)saveGame();return back;}

 if(ed.pz.items.filter(it=>it.o===myTag()).length>=PLAZA_MAX){ttoast(`광장에는 한 사람이 ${PLAZA_MAX}개까지 놓을 수 있어요`);return;}

 const id=SAVE.id,res=await pzReq({type:'plaza_put',gr:ed.gr,cl:ed.cl,x:i,y:j,k,s:DECO[k].s,f,id,n:SAVE.name,sig:hash(SALT+'pz'+lab+'|'+i+'|'+j+'|'+k+'|'+id)});

/* ---------- 반 랭킹 자동 연동 (구글 시트 + Apps Script) ---------- */
let liveMem=null,pushing=false,pushAgain=false,pushRetry=0;
const tmo=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),ms))]);
const liveCached=()=>liveMem||store.get('taja2_live',null);
function mergeLists(...ls){const m=new Map();for(const L of ls)for(const e0 of(L||[])){if(!validEntry(e0))continue;const e=Object.assign({},e0,{i:tagOf(e0.i)}),o=m.get(e.i);if(!o||(+e.ts||0)>(+o.ts||0))m.set(e.i,e);}return[...m.values()];}
function ago(t){if(!t)return '';const s=(Date.now()-t)/1000;if(s<60)return '방금';if(s<3600)return `${Math.floor(s/60)}분 전`;const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;}
// pin: [이 크롬북 관리]에서 선생님이 고친 정보를 보낼 때만 (시트에 '선생님이 정한 이름·번호'로 남아요)
let pushPin='';
async function syncPush(pin){if(typeof pin==='string'&&pin)pushPin=pin;if(!SYNC||!SAVE)return false;if(pushing){pushAgain=true;return false;}pushing=true;
 const data=JSON.stringify(myEntry()),req={type:'record',data,sig:hash(SALT+'sync'+data)},usedPin=pushPin;if(usedPin)req.pin=usedPin;
 const body=JSON.stringify(req);let ok=false,res=null,j=null;
 try{res=await tmo(fetch(SYNC_URL,{method:'POST',body}),20000);}catch(e){res=null;}
 if(res){try{j=await res.json();ok=!!(j&&j.ok);}catch(e){ok=false;}}
 else{try{await tmo(fetch(SYNC_URL,{method:'POST',body,mode:'no-cors'}),20000);ok=true;}catch(e){}}
 if(ok&&usedPin===pushPin)pushPin='';
 pushing=false;
 if(j)syncReply(j);
 if(!SAVE)return false;
 SAVE.syncPending=!ok&&!(j&&j.error==='deleted');if(ok)SAVE.syncAt=Date.now();saveGame();
 if(pushAgain){pushAgain=false;syncPush();}
 else if(!ok&&pushRetry<3){pushRetry++;setTimeout(syncPush,15000+Math.random()*20000);}
 else if(ok)pushRetry=0;
 return ok;}
async function syncPull(){if(!SYNC)return null;try{const r=await tmo(fetch(SYNC_URL+(SYNC_URL.includes('?')?'&':'?')+'action=list&_='+Date.now()),20000);const j=await r.json();
 if(j&&j.ok&&Array.isArray(j.list)){liveMem={t:Date.now(),list:j.list.filter(validEntry)};store.set('taja2_live',liveMem);return liveMem;}}catch(e){}return null;}
// 시트의 답: 선생님이 바꾼 이름·번호는 이 크롬북에도 바꾸고, 선생님이 지운 계정이면 이 크롬북을 처음 상태로 돌려요
function syncReply(j){if(!SAVE||!j)return;
 if(j.error==='deleted'){if(R&&!R.over)return;accountDeleted();return;}
 if(!j.ok)return;

const HANGUL=/[ㄱ-ㅎㅏ-ㅣ가-힣]/;let pinCaps=false,pinKo=false;
function pinCheck(e){const el=$('tPin'),m=$('tPinMsg');if(!el||!m)return;
 if(e.getModifierState)pinCaps=!!e.getModifierState('CapsLock');
 if(e.type==='keydown'){const k=e.key||'';
  if(k==='HangulMode'||k==='Lang1'||k==='HanjaMode')pinKo=false;
  else if(k==='Process'||e.keyCode===229||HANGUL.test(k))pinKo=true;
  else if(k.length===1)pinKo=false;}
 else if(e.type==='compositionstart'||e.type==='compositionupdate')pinKo=true;
 const hasKo=HANGUL.test(el.value);
 m.textContent=pinKo?'⌨️ 한글로 입력되고 있어요. 한/영 키를 눌러 영어로 바꿔 주세요.':hasKo?'⌨️ 한글이 섞여 있어요. 칸을 지우고 영어로 다시 입력해 주세요.':pinCaps?'⇪ Caps Lock이 켜져 있어요. 끄고 입력해 주세요.':'';}
['keydown','input','compositionstart','compositionupdate'].forEach(t=>document.addEventListener(t,e=>{if(e.target&&e.target.id==='tPin')pinCheck(e);},true));

/* 한글 입력(IME): 조합 중 Enter는 조합이 끝난 뒤 처리 */
let pendingEnter=false;

 if(v.endsWith(' ')){const t=nkey(v);if(!t){inp.value='';return;}
  const alive=R.ents.filter(e=>e.state==='alive'),spaced=alive.some(e=>e.word.includes(' ')),
   exact=alive.some(e=>nkey(e.word)===t)||R.bag.some(id=>itName(id)===t),longer=alive.some(e=>nkey(e.word).startsWith(t+' '));
  // 'go'와 'go camping'이 함께 있으면 스페이스바로 끊지 않고 끝까지 치게 해요(Enter를 누르면 'go')
  if((exact&&!longer)||!spaced)submit(v);return;}
 if(R.en){if(HANGUL.test(v))toast('한/영 키를 눌러 영어로 바꿔요! ⌨️');}else if(/[a-z]/i.test(v))toast('한/영 키를 눌러 한글로 바꿔요!');});
// Caps Lock 알림 (대문자까지 정확하게 쳐야 해서)
function capsCheck(e){if(!e.getModifierState)return;const on=!!e.getModifierState('CapsLock');$('capsNote').classList.toggle('show',on);inp.classList.toggle('caps',on);}
inp.addEventListener('keydown',capsCheck);inp.addEventListener('keyup',capsCheck);
inp.addEventListener('animationend',()=>inp.classList.remove('bad'));
document.addEventListener('keydown',e=>{if(scr!=='game'||!R)return;if(e.key==='Escape'){e.preventDefault();if(R.over)return;R.paused?ACT.resume():ACT.pause();return;}if(!R.paused&&!R.over&&document.activeElement!==inp)inp.focus();});
// 마을 꾸미기 단축키
document.addEventListener('keydown',e=>{if(scr!=='edit'||!ED||panelOpen())return;const tg=e.target;if(tg&&/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName))return;const k=e.key;
 if(k==='Escape'){e.preventDefault();edCancel();}
 else if(k==='f'||k==='F'||k==='ㄹ'){e.preventDefault();ACT['ed-flip']();}
 else if((k==='Delete'||k==='Backspace')&&ED.sel&&ED.mode==='deco'){e.preventDefault();ACT['ed-store']();}
 else if(k==='+'||k==='='){edZoom(1.2);}else if(k==='-'||k==='_'){edZoom(1/1.2);}
 else if(k.startsWith('Arrow')){e.preventDefault();const s=48;if(k==='ArrowLeft')ED.cam.x+=s;else if(k==='ArrowRight')ED.cam.x-=s;else if(k==='ArrowUp')ED.cam.y+=s;else ED.cam.y-=s;clampCam();}});
function toStage(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{if(scr==='game'&&R&&!R.paused&&!R.over){e.preventDefault();inp.focus();}else if(scr==='edit'&&ED){e.preventDefault();edDown(e);}});
window.addEventListener('pointermove',e=>{if(scr==='edit'&&ED)edMove(e);});
window.addEventListener('pointerup',e=>{if(scr==='edit'&&ED)edUp(e);});
window.addEventListener('pointercancel',e=>{PTRS.delete(e.pointerId);if(ED&&ED.drag&&ED.drag.type!=='pinch'){if(ED.carry&&ED.carry.drag)edCancel();ED.drag=null;}});
cv.addEventListener('wheel',e=>{if(scr!=='edit'||!ED)return;e.preventDefault();edZoom(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),toStage(e));},{passive:false});
cv.addEventListener('contextmenu',e=>{if(scr==='edit')e.preventDefault();});
cv.addEventListener('click',e=>{if(scr!=='home'||!SAVE||panelOpen())return;const n=SAVE.deco.n,cam=homeCam(n),p=toStage(e),wx=(p.x-cam.x)/cam.z,wy=(p.y-cam.y)/cam.z;
 if(inPoly(wx,wy,[IP(0,n),IP(n,n),IP(n,0),up(IP(n,0),120),up(IP(0,0),120),up(IP(0,n),120)]))openEditor('deco');});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scr==='game'&&R&&!R.over&&!R.paused)ACT.pause();});
window.addEventListener('resize',fit);

/* ================= 시작 ================= */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;ANIM_T+=dt;ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
 if(scr==='game'&&R){update(dt);if(R)drawGame();}else if(scr==='edit'&&ED)drawEditor();else drawHome(ANIM_T);
 requestAnimationFrame(loop);}
fit();goHome();
if(SYNC&&SAVE)setTimeout(syncPush,1500);
requestAnimationFrame(loop);
})();
</script>
